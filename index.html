<title>GCT583 Exam Room</title>

<style>
/* Layout: a paper exam sheet centred on a grey desk; sticky tab bar on top. Single deliberate light "paper" look. */
:root{
  --desk:#e9e9e7; --paper:#ffffff; --ink:#111111; --ink2:#4a4a4a; --ink3:#8a8a8a; --rule:#d6d6d6; --rule2:#ececec;
  --blue:#1546c9; --blue-bg:#eaf0ff; --red:#c4201b; --red-bg:#fdecea; --green:#167a36; --green-bg:#e7f5ec;
  --sans:"Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic","Nanum Gothic",system-ui,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
  color-scheme:light;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{background:var(--desk);color:var(--ink)}
body{font-family:var(--sans);font-size:15.5px;line-height:1.65;-webkit-font-smoothing:antialiased;margin:0}
button,input,textarea,select{font-family:inherit;font-size:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--ink)}

/* top bar */
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--ink);color:#fff;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.bar-in{max-width:880px;margin:0 auto;display:flex;align-items:center;gap:8px;height:52px}
.brand{font-weight:900;letter-spacing:.02em;font-size:15px;margin-right:auto;white-space:nowrap}
.brand span{font-family:var(--mono);font-weight:600;opacity:.65;margin-left:6px;font-size:12px}
@media (max-width:480px){.brand span{display:none}.tab{padding:6px 7px;font-size:13.5px}.bar-in{gap:2px}}
.tab{background:none;border:0;color:#cfcfcf;padding:6px 10px;border-radius:4px;font-weight:500;font-size:14px;white-space:nowrap}
.tab[aria-current="page"]{color:#fff;background:#2b2b2b}
.tab .badge{display:inline-block;min-width:18px;padding:0 5px;margin-left:5px;border-radius:9px;background:var(--red);color:#fff;font-size:11px;line-height:18px;text-align:center;font-family:var(--mono)}

.wrap{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:28px 80px}
.sheet{max-width:880px;margin:0 auto;background:var(--paper);border:1px solid #cfcfcd;box-shadow:0 1px 0 #d9d9d7,0 10px 30px -18px rgba(0,0,0,.35);padding:40px 48px 48px}
@media (max-width:640px){.sheet{padding:24px 18px 32px}}
.sheet + .sheet{margin-top:24px}

/* exam header */
.exam-head{border:2px solid var(--ink);display:grid;grid-template-columns:1fr auto}
.exam-head .t{padding:14px 18px;border-right:2px solid var(--ink)}
.exam-head .t small{display:block;font-family:var(--mono);font-size:11.5px;letter-spacing:.08em;color:var(--ink2);text-transform:uppercase}
.exam-head h1{margin:2px 0 0;font-size:24px;line-height:1.25;font-weight:900;text-wrap:balance}
.exam-head .meta{display:grid;grid-template-columns:auto auto;font-size:13px;min-width:230px}
.exam-head .meta div{padding:6px 12px;border-bottom:1px solid var(--ink)}
.exam-head .meta div:nth-child(odd){font-weight:700;border-right:1px solid var(--ink);background:#f4f4f4}
.exam-head .meta div:nth-last-child(-n+2){border-bottom:0}
@media (max-width:640px){.exam-head{grid-template-columns:1fr}.exam-head .t{border-right:0;border-bottom:2px solid var(--ink)}.exam-head h1{font-size:20px}}
.instr{font-size:13.5px;color:var(--ink2);border-bottom:1px solid var(--ink);padding:10px 2px 12px;margin-bottom:8px}
.instr b{color:var(--ink)}
.part{display:flex;align-items:baseline;gap:12px;margin:34px 0 6px;padding-bottom:6px;border-bottom:2px solid var(--ink)}
.part h2{margin:0;font-size:18px;font-weight:900}
.part span{font-size:13px;color:var(--ink2)}

/* setup */
.lede{font-size:15px;color:var(--ink2);max-width:64ch}
.levels{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin:22px 0}
@media (max-width:640px){.levels{grid-template-columns:1fr}}
.lv{border:1.5px solid var(--ink);background:#fff;text-align:left;padding:14px 16px;border-radius:2px;display:flex;flex-direction:column;gap:2px;min-width:0}
.lv b{font-size:18px;font-weight:900}
.lv i{font-style:normal;font-family:var(--mono);font-size:11.5px;color:var(--ink2);letter-spacing:.05em}
.lv span{font-size:13px;color:var(--ink2)}
.lv[aria-pressed="true"]{background:var(--ink);color:#fff}
.lv[aria-pressed="true"] i,.lv[aria-pressed="true"] span{color:#d8d8d8}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.btn{border:1.5px solid var(--ink);background:var(--ink);color:#fff;padding:9px 18px;border-radius:2px;font-weight:700}
.btn.ghost{background:#fff;color:var(--ink)}
.btn.sm{padding:5px 11px;font-size:13px;font-weight:500}
.btn:disabled{opacity:.4;cursor:not-allowed}
.stat{font-family:var(--mono);font-size:12.5px;color:var(--ink2)}
.resume{margin-top:18px;padding:12px 14px;border:1px dashed var(--ink);font-size:14px}

/* question */
.q{padding:22px 0 20px;border-bottom:1px solid var(--rule)}
.q:last-child{border-bottom:0}
.qhead{display:flex;gap:10px;align-items:flex-start}
.qn{font-weight:900;font-size:17px;min-width:30px;font-variant-numeric:tabular-nums}
.qstem{font-size:16px;font-weight:500;min-width:0;flex:1}
.qtag{font-family:var(--mono);font-size:11px;color:var(--ink3);margin-left:40px;margin-top:2px;letter-spacing:.03em}
.stemimg{margin:12px 0 4px 40px;border:1px solid var(--rule);max-width:min(560px,calc(100% - 40px))}
.opts{list-style:none;margin:12px 0 0;padding:0 0 0 40px;display:flex;flex-direction:column;gap:6px}
.opt{width:100%;display:flex;gap:12px;align-items:flex-start;text-align:left;background:#fff;border:1px solid transparent;padding:7px 10px;border-radius:3px;line-height:1.5}
.opt:hover:not(:disabled){border-color:var(--rule);background:#fafafa}
.opt:disabled{cursor:default}
.bub{flex:none;width:24px;height:24px;border:1.5px solid var(--ink);border-radius:50%;display:grid;place-items:center;font-size:12px;font-weight:700;font-family:var(--mono);margin-top:-1px}
.opt.right{background:var(--green-bg);border-color:var(--green)}
.opt.right .bub{background:var(--green);border-color:var(--green);color:#fff}
.opt.wrong{background:var(--red-bg);border-color:var(--red)}
.opt.wrong .bub{background:var(--red);border-color:var(--red);color:#fff}
.opt.wrong .otext{text-decoration:line-through;text-decoration-color:var(--red)}
.opt.dim{opacity:.55}

/* feedback */
.fb{margin:14px 0 0 40px;border-left:4px solid var(--ink);padding:12px 16px;background:#fafafa}
.fb.ok{border-color:var(--green)} .fb.no{border-color:var(--red)}
.verdict{font-weight:900;font-size:15px}
.fb.ok .verdict{color:var(--green)} .fb.no .verdict{color:var(--red)}
.concept{color:var(--blue);font-weight:700}
.ex{margin:6px 0 0;font-size:14.5px}
.src{margin-top:10px;font-size:13.5px}
.src .who{font-family:var(--mono);font-size:11.5px;letter-spacing:.04em;color:var(--ink2);text-transform:uppercase}
.src .who b{color:var(--ink)}
blockquote{margin:4px 0 0;padding:8px 12px;border:1px solid var(--rule);background:#fff;font-size:13.5px;color:#222;line-height:1.6;overflow-wrap:anywhere}
blockquote::before{content:"“";font-weight:900;margin-right:2px}
blockquote::after{content:"”";font-weight:900;margin-left:2px}
.slide{margin-top:10px}
.slide summary{font-size:13px;color:var(--ink2);cursor:pointer}
.slide img{display:block;margin-top:6px;border:1px solid var(--rule);max-width:100%}

/* essay */
.lined{width:100%;margin:12px 0 0;min-height:190px;resize:vertical;border:1px solid var(--ink);border-radius:0;padding:6px 12px;line-height:30px;font-size:15px;
  background:#fff repeating-linear-gradient(to bottom,transparent 0,transparent 29px,var(--rule2) 29px,var(--rule2) 30px);background-attachment:local;background-position:0 6px}
.essay-wrap{margin-left:40px}
@media (max-width:640px){.essay-wrap,.opts,.fb,.qtag{margin-left:0;padding-left:0}.stemimg{margin-left:0;max-width:100%}}
.ehint{font-size:12.5px;color:var(--ink3);margin-top:4px}
.grade{margin-top:16px;border:1.5px solid var(--ink)}
.grade-h{display:flex;flex-wrap:wrap;align-items:center;gap:14px;padding:10px 14px;border-bottom:1px solid var(--ink);background:#f6f6f6}
.score{font-family:var(--mono);font-weight:600;font-size:22px}
.score.ok{color:var(--green)} .score.no{color:var(--red)}
.meter{flex:1;min-width:120px;height:8px;background:var(--rule2);position:relative}
.meter i{position:absolute;inset:0 auto 0 0;background:var(--ink)}
.grade-b{padding:12px 14px;display:flex;flex-direction:column;gap:14px}
.glabel{font-family:var(--mono);font-size:11.5px;letter-spacing:.06em;color:var(--ink2);text-transform:uppercase;margin-bottom:4px}
.keys{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:4px;font-size:14px}
.keys li{display:flex;gap:8px;align-items:flex-start}
.keys .mk{flex:none;width:20px;height:20px;display:grid;place-items:center;font-weight:900;font-size:12px;color:#fff;border-radius:2px;margin-top:2px}
.keys .hit .mk{background:var(--green)} .keys .miss .mk{background:var(--red)} .keys .part .mk{background:#b7791f}
.keys .miss{color:var(--red)} .keys .hit{color:var(--green)}
.keys .cm{display:block;color:var(--ink2);font-size:13px}
.mine,.model{font-size:14.5px;line-height:1.75;padding:10px 12px;border:1px solid var(--rule);background:#fff;white-space:pre-wrap;overflow-wrap:anywhere}
.mine mark.hit{background:var(--green-bg);color:var(--green);border-bottom:2px solid var(--green);padding:0 1px}
.mine mark.err{background:var(--red-bg);color:var(--red);border-bottom:2px solid var(--red);padding:0 1px}
.model .k-hit{color:var(--blue);font-weight:700;border-bottom:2px solid var(--green)}
.model .k-miss{color:var(--red);font-weight:700;background:var(--red-bg);border-bottom:2px solid var(--red)}
.legend{font-size:12px;color:var(--ink2);display:flex;flex-wrap:wrap;gap:12px}
.legend span::before{content:"";display:inline-block;width:10px;height:10px;margin-right:5px;vertical-align:-1px}
.legend .l1::before{background:var(--green)} .legend .l2::before{background:var(--red)} .legend .l3::before{background:var(--blue)}
.errs{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px;font-size:14px}
.errs li{border-left:3px solid var(--red);padding:2px 0 2px 10px}
.errs q{color:var(--red);font-weight:700}
.ai-out{font-size:14px}
.muted{color:var(--ink2);font-size:13px}

/* summary */
.summary{border:2px solid var(--ink);padding:18px 20px;margin-top:30px;display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.summary div b{display:block;font-family:var(--mono);font-size:26px}
.summary div span{font-size:12.5px;color:var(--ink2)}
@media (max-width:640px){.summary{grid-template-columns:1fr 1fr}}

/* notes */
.ntools{display:flex;flex-wrap:wrap;gap:8px;margin:16px 0 6px}
.chip{border:1px solid var(--ink);background:#fff;padding:3px 10px;border-radius:14px;font-size:12.5px}
.chip[aria-pressed="true"]{background:var(--ink);color:#fff}
.note{border:1px solid var(--ink);margin-top:14px;position:relative}
.note-h{padding:14px 16px 10px;display:flex;gap:12px;align-items:flex-start}
.note-h .nc{flex:1;min-width:0}
.ntag{font-family:var(--mono);font-size:11px;color:var(--ink2);letter-spacing:.04em}
.nconcept{font-size:21px;font-weight:900;color:var(--blue);line-height:1.3;margin:2px 0 0;text-wrap:balance}
.nx{flex:none;width:32px;height:32px;border:1px solid var(--rule);background:#fff;font-size:18px;line-height:1;border-radius:2px}
.nx:hover{border-color:var(--red);color:var(--red)}
.note-b{padding:0 16px 14px;display:flex;flex-direction:column;gap:8px;font-size:14.5px}
.ans-ok{color:var(--green);font-weight:700}
.ans-no{color:var(--red);text-decoration:line-through}
.confirm{display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:8px 16px;background:var(--red-bg);border-top:1px solid var(--red);font-size:13.5px;color:var(--red)}
.note details summary{font-size:13px;color:var(--ink2);cursor:pointer}
.empty{border:1px dashed var(--ink3);padding:28px;text-align:center;color:var(--ink2);margin-top:16px}
.misslist{margin:0;padding-left:18px;color:var(--red)}

/* materials */
.lock{border:2px solid var(--ink);padding:16px 18px;margin:18px 0;display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.lock input{border:1.5px solid var(--ink);padding:8px 12px;min-width:0;flex:1 1 200px;border-radius:0}
.files{list-style:none;margin:0;padding:0;border-top:1px solid var(--ink)}
.instr + .files{border-top:0}
.files li{display:flex;gap:12px;align-items:center;padding:12px 2px;border-bottom:1px solid var(--rule)}
.files .fn{flex:1;min-width:0}
.files .fn b{display:block;font-weight:700;overflow-wrap:anywhere}
.files .fn span{font-family:var(--mono);font-size:11.5px;color:var(--ink2)}
.files .code{font-family:var(--mono);font-weight:600;font-size:13px;width:44px;flex:none}
.msg{font-size:13.5px}
.msg.no{color:var(--red)} .msg.ok{color:var(--green)}
.foot{max-width:880px;margin:18px auto 0;font-size:12px;color:var(--ink3);text-align:center}
</style>

<p class="foot">GCT583 Museum Technology in Digital Era · 문제는 업로드된 강의자료의 표현을 그대로 인용합니다.</p>

<script>
/* ======================= DATA ======================= */
const LEC = {
  L01:{t:`01 What is a Museum?`, f:`GCT583_01_What_is_a_Museum`},
  L02:{t:`02 The Evolving Museum: New Museology and Computerization`, f:`GCT583_02_Museums_in_the_Digital_Age`},
  L03:{t:`03 Museum Informatics`, f:`GCT583_03_Museum_Informatics`},
  L04:{t:`04 Data Management`, f:`GCT583_04_Data_Management__1_`},
  L06:{t:`06 Digitization`, f:`GCT583_06_Digitization`},
  L07:{t:`07 3D Application in Museums`, f:`GCT583_07_3D_Application_in_Museums__1_`},
  L08:{t:`08 Hands-on and Interactive Museum`, f:`GCT583_08_Interactive_Museum`},
  L09:{t:`09 Technology Horizon for Museums`, f:`GCT583_09_Technology_Horizon_for_Museums`},
  L10:{t:`10 Mobile Technologies for Museums`, f:`GCT583_10_Mobile_Technologies`},
  L11:{t:`11 Virtual Museum`, f:`GCT583_11_Virtual_Museum`},
  HCI:{t:`HCI in the Museum Context`, f:`GCT583_HCI_in_the_Museum_Context`},
  NOTE:{t:`강의 노트 (Lecture Notes)`, f:`unknown`}
};
const LVN = {1:`초급`,2:`중급`,3:`고급`};
const LVE = {1:`BEGINNER`,2:`INTERMEDIATE`,3:`ADVANCED`};
const MCQ = [], ESSAY = [];
let _mi = {1:0,2:0,3:0}, _ei = {1:0,2:0,3:0};
function M(lv,lec,p,c,q,o,ex,qt,img,stem){ _mi[lv]++; MCQ.push({id:`m${lv}-${String(_mi[lv]).padStart(3,'0')}`,lv,lec,p,c,q,o,ex,qt,img,stem}); }
function E(lv,lec,p,c,q,model,keys,quotes){ _ei[lv]++; ESSAY.push({id:`e${lv}-${String(_ei[lv]).padStart(2,'0')}`,lv,lec,p,c,q,model,keys:keys.map(k=>({t:k[0],en:k[1],ko:k[2]})),quotes}); }
// ===== Beginner MCQ (lv 1). Option[0] is always the correct answer; the app shuffles. =====
M(1,`L01`,97,`ICOM (International Council of Museums)`,
`In which year was the International Council of Museums (ICOM) created "by and for museum professionals"?`,
[`1946`,`1906`,`1970`,`2007`],
`ICOM은 1946년에 박물관 전문가들에 의해, 전문가들을 위해 설립되었다. 1906년은 AAM(American Alliance of Museums) 설립 연도이고, 2007년은 Vienna 정의가 채택된 해다.`,
`created in 1946 by and for museum professionals`);

M(1,`L01`,69,`Mouseion`,
`The Greek word "Mouseion," from which the word "museum" derives, originally meant:`,
[`"seat of the Muses"`,`"house of treasures"`,`"room of wonder"`,`"place of records"`],
`Mouseion은 "seat of the Muses(뮤즈의 자리)"라는 뜻으로, 뮤즈에게 바쳐진 철학적 기관이자 사색의 장소였다. Alexandria의 통치자 Ptolemy Sotor가 세웠다.`,
`Greek 'Mouseion' > 'Museum' • "seat of the Muses" • a philosophical institution or a place of contemplation dedicated to the Muses`);

M(1,`L01`,67,`Ennigaldi-Nanna's Museum`,
`Which is thought by some historians to be the oldest known museum, dating to circa 530 BCE?`,
[`Ennigaldi-Nanna's Museum`,`The Mouseion of Alexandria`,`The Ashmolean Museum`,`The Athenian Treasury at Delphi`],
`Ennigaldi-Nanna's Museum은 기원전 530년경으로 추정되는 가장 오래된 박물관이며 큐레이터는 Princess Ennigaldi였다.`,
`The oldest known museum (thought by some historians) • dates to circa 530 BCE • Curator: Princess Ennigaldi`);

M(1,`L01`,75,`Cabinet of Curiosities (Wunderkammer)`,
`In the "Cabinet of Curiosities" (Wunderkammer, Kunstkammer), what did the word "cabinet" refer to?`,
[`A room rather than a piece of furniture`,`A glass display case for a single object`,`A government ministry for culture`,`A printed catalogue of objects`],
`Cabinet of Curiosities에서 cabinet은 가구가 아니라 "방(room)"을 의미했다. 소유자의 명성(prestige) 또는 학문적 목적을 위해 만들어졌다.`,
`Cabinets of Wonder • Wunderkammer (wonder-rooms), Kunstkammer • cabinet: a room rather than a piece of furniture • made for the prestige of the owners or scholarly purposes`);

M(1,`L01`,142,`Children's Museum`,
`Which was the first children's museum in the world?`,
[`Brooklyn Children's Museum (founded in 1899)`,`Boston Children's Museum (founded in 1913)`,`Exploratorium (founded in 1969)`,`Museum of Science, Boston (founded in 1951)`],
`세계 최초의 어린이 박물관은 1899년 설립된 Brooklyn Children's Museum이다.`,
`The first children's museum in the world: Brooklyn Children's Museum (founded in 1899)`);

M(1,`L01`,155,`Curator`,
`The words "curate" and "curator" come from Latin meaning:`,
[`"to care"`,`"to collect"`,`"to display"`,`"to judge"`],
`curate/curator는 라틴어 "to care(돌보다)"에서 유래했다. 오늘날 큐레이터의 역할은 확장되었다(Curatorial roles have expanded).`,
`curate and curator from Latin "to care" • Curatorial roles have expanded`);

M(1,`L01`,168,`Museum 2.0`,
`Who coined the term "Museum 2.0," associated with participatory museums and visitor-curated content making?`,
[`Nina Simon`,`Duncan Cameron`,`Stephen E. Weil`,`André Malraux`],
`Museum 2.0은 Nina Simon이 만든 용어로, participatory museums와 visitor-curated content making을 강조한다.`,
`Museum 2.0 (coined by Nina Simon) • Participatory museums • Visitor-curated content making`);

M(1,`L01`,167,`Displays vs. Exhibits`,
`According to the lecture, how are "displays" and "exhibits" distinguished?`,
[`Displays are for experts; exhibits are for public education`,`Displays are permanent; exhibits are always temporary`,`Displays are online; exhibits are physical`,`Displays are interactive; exhibits are static`],
`Displays는 전문가용(for experts), Exhibits는 대중 교육용(for public education)이다. Exhibit의 종류는 Permanent, Temporary, Online.`,
`Displays • for experts | Exhibits • for public education • A showing or display of materials for the purpose of communication with an audience • Classes: Permanent, Temporary, Online`);

M(1,`L01`,140,`Science Museums`,
`Which statement best describes science museums (science centers, discovery spaces, planetariums)?`,
[`They usually contain mostly interactive exhibits, and very few have permanent collections`,`They are based on aesthetic philosophy and use little text on labels`,`They collect objects to document important persons, places, or events`,`They maintain and interpret living collections`],
`과학관은 대부분 interactive exhibits로 구성되고 영구 소장품(permanent collections)은 거의 없다. 나머지 보기는 각각 Art museums, History museums, Botanical gardens/Zoos의 특징.`,
`Science centers, discovery spaces, planetariums • Usually contain mostly interactive exhibits, and very few have permanent collections`);

M(1,`L01`,147,`Functions of a Museum`,
`Which of the following is listed as one of the functions of a museum in the lecture?`,
[`To interpret and to engage`,`To sell and to profit`,`To legislate and to regulate`,`To entertain only`],
`박물관의 기능: To collect / To conserve / To exhibit / To interpret and to engage / To serve and to act.`,
`To collect • To conserve • To exhibit • To interpret and to engage • To serve and to act`);

M(1,`L02`,4,`Temple or Forum`,
`Who wrote "The Museum, a Temple or the Forum" (1971)?`,
[`Duncan Cameron`,`Peter van Mensch`,`Nina Simon`,`Hugues de Varine`],
`Duncan Cameron이 1971년 "The Museum, a Temple or the Forum"을 썼다. Temple(권위적 해석)과 Forum(논쟁적 대화)을 대비한다.`,
`Duncan Cameron, "The Museum, a Temple or the Forum" (1971)`, `temple`);

M(1,`L02`,10,`Museum Studies`,
`According to the lecture, "Museum studies" equals:`,
[`Museology (theory) + Museography (practice)`,`Museography (theory) + Museology (practice)`,`Museology (practice) + Informatics (theory)`,`Curation (theory) + Conservation (practice)`],
`Museum studies = Museology(이론) + Museography(실천). Museography는 museology의 practical, applied side이다.`,
`Museum studies = Museology (theory) + Museography (practice)`);

M(1,`L02`,21,`Ecomuseum`,
`The concept of the Ecomuseum was developed in 1971 by:`,
[`Hugues de Varine and George Riviere`,`Duncan Cameron and Peter van Mensch`,`André Desvallées and Nina Simon`,`John Falk and Lynn Dierking`],
`Ecomuseum은 1971년 Hugues de Varine과 George Riviere가 개발한 개념이다. 공동체가 지속가능한 발전을 위해 유산을 보존·해석·관리하는 방식.`,
`One of the newest types of museums • A concept developed by Hugues de Varine and George Riviere in 1971`, `eco`);

M(1,`L02`,26,`The Participatory Museum`,
`In "The Participatory Museum" (2010), how does Nina Simon reframe the visitor?`,
[`As a co-producer of meaning`,`As a passive receiver of expert interpretation`,`As a paying customer of the museum shop`,`As a subject of visitor surveillance`],
`Nina Simon은 방문객을 "co-producer of meaning(의미의 공동 생산자)"으로 재정의했다. Community museology(1972)와 Web 2.0이 만난 결과.`,
`Reframes the visitor into a co-producer of meaning • "Every visitor who walks in has something to contribute." — Nina Simon`);

M(1,`L02`,33,`SELGEM`,
`SELGEM ("SELf GEnerating Master"), one of the first museum database management systems, was built by:`,
[`The Smithsonian (placed in operation in 1970)`,`The Arizona State Museum (1975)`,`The Detroit Institute of Arts (1980s)`,`The British Museum (1968)`],
`SELGEM은 Smithsonian이 만들어 1970년부터 운영했다. GRIPHOS는 UN 도서관 시스템을 박물관용으로 1968년에 변형한 것이고, REGIS는 Arizona State Museum(1975).`,
`First database management systems appear: SELGEM ("SELf GEnerating Master"), built by the Smithsonian and placed in operation in 1970`);

M(1,`L02`,49,`LAM / GLAM`,
`What does "GLAM" stand for?`,
[`Galleries, Libraries, Archives, and Museums`,`Global Library and Archive Management`,`Galleries, Labs, Arts, and Media`,`Government Libraries And Museums`],
`LAM = Libraries, Archives, and Museums, GLAM은 여기에 Galleries를 더한 것. 이들을 "Memory institutions"라 부른다.`,
`LAM, GLAM: Libraries, Archives, and Museums (+Galleries). Memory institutions`);

M(1,`L02`,12,`Santiago Round Table (1972)`,
`The Santiago Round Table (1972), organised by ICOM and UNESCO in Chile, introduced which idea?`,
[`"Community museology" — museums developed for and with the people`,`The first code of museum ethics`,`The first museum database management system`,`The "museum without walls"`],
`Santiago Round Table은 "community museology", 즉 사람들을 위해(for) 그리고 사람들과 함께(with) 개발되는 박물관이라는 아이디어를 제시했다.`,
`The idea of "community museology" — museums developed for and with the people`);

M(1,`L03`,6,`Museum Informatics`,
`Museum Informatics is defined as:`,
[`The study of the socio-technical interactions that take place at the intersection of people, information, and technology in museums`,`The engineering of computer hardware used in museum galleries`,`The statistical analysis of museum ticket sales`,`The study of the history and architecture of museum buildings`],
`Museum Informatics = 박물관에서 사람·정보·기술이 교차하는 지점에서 일어나는 socio-technical interactions에 대한 연구.`,
`The study of the socio-technical interactions that take place at the intersection of people, information, and technology in museums`);

M(1,`L03`,18,`Data`,
`Which definition matches "data" in the lecture?`,
[`Raw facts and figures that on their own have no meaning`,`A message that contains relevant meaning, implication, or input for decision`,`The understanding of rules needed to interpret information`,`Results of experience organized and stored inside each individual's mind`],
`Data = 기록된 기호와 신호값, 그 자체로는 의미가 없는 raw facts and figures (Unorganized and unprocessed). 두 번째는 Information, 세 번째와 네 번째는 Knowledge의 정의.`,
`Recorded (captured and stored) symbols and signal readings • Raw facts and figures that on their own have no meaning • Unorganized and unprocessed`);

M(1,`L03`,27,`Knowledge`,
`According to the lecture, what is the purpose of knowledge?`,
[`Value creation`,`Aiding decisions and solving problems`,`Recording signal readings`,`Storing raw facts`],
`"The purpose of knowledge is for value creation." Information의 목적은 aid in making decisions and/or solving problems.`,
`the understanding of rules needed to interpret information • The purpose of knowledge is for value creation.`);

M(1,`L03`,70,`"The Smithsonian is Information"`,
`Who stated "The Smithsonian is Information" (1981)?`,
[`Lytle`,`Marty`,`Bearman`,`Boiko`],
`Lytle(1981)의 말로, 박물관이 정보의 사업(Business of Information)을 하고 있음을 보여준다.`,
`Museums in the Business of Information • "The Smithsonian is Information" - Lytle(1981)`);

M(1,`L03`,78,`Lack of Standards (NASA case)`,
`Why did NASA lose the $125 million Mars Climate Orbiter in 1999, the case used to illustrate the importance of standards?`,
[`One team used English units while the other used the metric system`,`The magnetic tapes holding the data were corrupted`,`The software could not be emulated on new hardware`,`The metadata was embedded in the data files`],
`Lockheed Martin 팀은 English units를, NASA 팀은 metric system을 사용해 손실이 발생했다. 표준 부재(Lack of Standards)의 위험을 보여주는 사례. (자기테이프 손상은 Viking 사례)`,
`NASA lost a $125 million Mars orbiter because a Lockheed Martin engineering team used English units of measurement while the agency's team used the more conventional metric system for a key spacecraft operation`);

M(1,`L03`,41,`Surrogates`,
`In information representation, "surrogates" means:`,
[`Making information entities smaller (e.g., creating catalog card records)`,`Creating a single resource that represents groups of information entities`,`Making a list of all artifacts`,`Storing original objects in climate-controlled rooms`],
`Surrogates = 정보 개체를 더 작게 만드는 것(예: catalog card records). Aggregates = 여러 정보 개체를 대표하는 하나의 자원을 만드는 것(예: 전체 유물 목록).`,
`surrogates: making information entities smaller (e.g., creating catalog card records) | aggregates: creating a single resource that represents groups of information entities (e.g., making a list of all artifacts)`);

M(1,`L04`,5,`Metadata`,
`Metadata is commonly described as:`,
[`"Data about data"`,`"Data without data"`,`"Data before collection"`,`"Data for display only"`],
`Metadata = "Data about data" / "Information about information". meta-는 그리스어로 "after" 또는 "beyond".`,
`"Data about data" | "Information about information"`);

M(1,`L04`,27,`Dublin Core`,
`How many main properties does Dublin Core define for data description?`,
[`15`,`12`,`10`,`21`],
`Dublin Core는 15개의 main properties를 정의하며 특정 도메인에 맞게 확장 가능하다. (12는 ESE가 Dublin Core에 추가한 Europeana 요소 수)`,
`Defines 15 main properties for data description • Extendible for a specific domain • Dublin Core Metadata Initiative (DCMI)`, `dublin`);

M(1,`L04`,31,`RDF (Resource Description Framework)`,
`The Resource Description Framework (RDF) is developed and maintained by:`,
[`The W3C`,`ICOM`,`UNESCO`,`The Dublin Core Metadata Initiative`],
`RDF는 W3C가 개발·관리하며, 웹에서 기계가 이해 가능한 메타데이터를 교환하는 애플리케이션 간 semantic interoperability를 제공한다. Semantic web의 표준으로 구상됨.`,
`Developed and maintained by the W3C • a metadata framework that provides a degree of semantic interoperability among applications that exchange machine-understandable metadata on the Web`);

M(1,`L04`,87,`Refreshing`,
`Which digital preservation strategy is described as "the transfer of data between two types of the same storage medium" with "no bit changes or alteration of data"?`,
[`Refreshing`,`Migration`,`Emulation`,`Encapsulation`],
`Refreshing = 단기 보존 전략(Short-term preservation strategy). 같은 종류의 저장 매체 간 데이터 복사, 비트 변경 없음.`,
`Refreshing • Short-term preservation strategy • the transfer of data between two types of the same storage medium • no bit changes or alteration of data`);

M(1,`L04`,70,`Viking Probes Case`,
`What happened to the data from the two Viking space probes sent to Mars in 1975?`,
[`The data on magnetic tapes was corrupted/unidentifiable after 2 decades and the formats could not be decoded`,`The data was lost because two teams used different units of measurement`,`The data was released under Creative Commons "0"`,`The data was migrated to an OAIS repository without loss`],
`Viking 탐사선 데이터($1 billion이 든 반복 불가능한 미션)는 기후 제어 환경에 보관했음에도 20년 후 자기테이프가 손상되고 포맷을 해독할 수 없게 되었다. 디지털 보존 문제의 대표 사례.`,
`Recorded data on magnetic tapes was corrupted/unidentifiable after 2 decades despite being kept in climate controlled environment. • Scientists could not access data, unable to decode the formats used.`);

M(1,`L04`,78,`UNESCO Charter on the Preservation of Digital Heritage`,
`When was the UNESCO Charter on the Preservation of Digital Heritage adopted?`,
[`October 17, 2003`,`August 24, 2007`,`November 20, 2008`,`August 24, 2022`],
`UNESCO 디지털 유산 보존 헌장은 2003년 10월 17일 UNESCO 총회에서 채택되었다.`,
`Adopted on October 17, 2003 in a session of the General Conference of UNESCO`);

M(1,`L04`,75,`Digital Dark Age`,
`The "Digital Dark Age" refers to:`,
[`A lack of historical information in the digital age`,`The period 600 AD–1600 AD in Western Europe`,`The years before museums used computers`,`The loss of museum visitors during COVID-19`],
`Digital Dark Age = 디지털 시대의 역사적 정보 부족. 기술 발전에 따라 파일 포맷·소프트웨어·하드웨어가 구식화되어 손상·희소·접근 불가능해지는 문제. 1997년 IFLA 회의에서 초기 언급.`,
`a lack of historical information in the digital age • An early mention at a conference of the International Federation of Library Associations and Institutions (IFLA) in 1997`);

M(1,`L06`,3,`Digitization`,
`Digitization is defined as a set of processes that convert physical resources to a digital form, consisting of:`,
[`Sampling + Quantization`,`Scanning + Printing`,`Encoding + Encryption`,`Compression + Migration`],
`Digitization = 물리적 자원을 디지털 형태(binary code)로 변환하는 일련의 과정 = Sampling + Quantization.`,
`A set of processes that convert physical resources to a digital form(binary code) • Sampling + Quantization`);

M(1,`L06`,64,`Photogrammetry`,
`The word "photogrammetry" literally means:`,
[`"photomeasurement"`,`"photo-writing"`,`"light-scanning"`,`"image-printing"`],
`photo = "picture", grammetry = "measurement" → photogrammetry = "photomeasurement". 1860년대부터 사용.`,
`photo = "picture", grammetry = "measurement", photogrammetry = "photomeasurement" • Since 1860s`);

M(1,`L06`,90,`Rijksmuseum Open Data`,
`What copyright status did the Rijksmuseum apply to its freely downloadable high-resolution images?`,
[`Creative Commons "0" (CC0)`,`All rights reserved`,`Paid commercial license only`,`Creative Commons Non-Commercial only`],
`Rijksmuseum은 고해상도 이미지를 무료로 제공하며 "a very progressive approach to copyright: Creative Commons '0' status"를 적용했다.`,
`Freely available for download in high-resolution on rijksmuseum.nl, with new images being added every day • a very progressive approach to copyright : Creative Commons "0" status`, `rijks`);

M(1,`L06`,32,`Color Depth`,
`In digital imaging, how many colors does 24-bit "true color" represent?`,
[`About 16,700,000 colors`,`256 colors`,`65,532 colors`,`1,024 colors`],
`8bit=256 colors, 16bit=65,532 colors(high color), 24bit=16,700,000 colors(true color). 각 샘플의 값이 color depth를 결정(Quantization).`,
`8bit(256 colors), 16bit(65,532 colors, high color), 24bit(16,700,000 colors, true color)`);

M(1,`L06`,92,`FAIR Principles`,
`In the FAIR principles of the UNESCO Recommendation on Open Science, what does "F-A-I-R" stand for?`,
[`Findable, Accessible, Interoperable, Reusable`,`Free, Available, Integrated, Reliable`,`Formatted, Archived, Indexed, Retrievable`,`Fair, Authentic, Inclusive, Responsible`],
`FAIR = Findable(쉽게 발견), Accessible(기술적·법적 장벽 없이 접근), Interoperable(시스템 간 상호운용), Reusable(재사용·재분석 가능).`,
`Data must be structured and standardized so that it is easily discoverable (Findable), accessible without technical or legal barriers (Accessible), interoperable across various systems and platforms (Interoperable), and capable of being reused and reanalyzed (Reusable).`);

M(1,`L07`,7,`Structured Light 3D Scanning`,
`Structured light 3D scanning uses:`,
[`A single camera + a light source with a known pattern`,`A physical probe that touches the object`,`A pulse of light whose return time is measured`,`Only photographs taken from many angles with no light source`],
`Structured Light = Single camera + Light source with a known pattern. 생성된 패턴과 촬영된 패턴의 매칭 문제가 있으며, 해결책은 패턴을 코드화(Codifying the pattern)하는 것.`,
`Single camera + Light source with a known pattern • Problem of matching between the generated pattern and the captured one • Solution: Codifying the pattern`, `struct`);

M(1,`L07`,59,`3D Printing for Accessibility`,
`Which use of 3D printing in museums is highlighted under the idea of "Please touch"?`,
[`Replicas for the blind`,`Printing museum tickets`,`Replacing original artworks in storage`,`Producing staff uniforms`],
`3D Printing은 "Please touch" 경험을 가능하게 하며, 시각장애인을 위한 만질 수 있는 replica 제작(Replica for the Blind)이 대표 사례.`,
`3D Printing • "Please touch" | Replica for the Blind`);

M(1,`L07`,42,`Madonna of Pietranico`,
`The Madonna of Pietranico case shows the use of 3D digital technologies for:`,
[`Assisting the restoration of a fragmented terracotta statue`,`Creating a VR locomotion interface`,`Mass digitization of a museum collection`,`Indoor positioning of visitors`],
`Madonna of Pietranico는 파편화된 terracotta 조각상의 복원을 3D 기술로 지원한 사례(Virtual reassembly → Support extraction → Supports).`,
`Innovative uses of 3D digital technologies to assist the restoration of a fragmented terracotta statue | Virtual reassembly • Support extraction • Supports`);

M(1,`L08`,9,`Contextual Model of Learning`,
`Falk and Dierking's (2000) Contextual Model of Learning involves the interplay of which three contexts?`,
[`Personal, Sociocultural, and Physical`,`Personal, Digital, and Physical`,`Social, Economic, and Political`,`Cognitive, Affective, and Behavioral`],
`Contextual Model of Learning: 모든 경험은 맥락적이며 Personal, Sociocultural, Physical 세 맥락의 상호작용을 포함한다.`,
`It assumes all experience is contextual and involves interplay of three contexts • Personal Context • Sociocultural Context • Physical Context`, `ctx12`);

M(1,`L08`,22,`Constructivist Learning`,

[`Jean Piaget`,`John Falk`,`Nina Simon`,`Vannevar Bush`],
`Personal Context의 Construction: 지식은 항상 기존 지식 위에 쌓인다 — Piaget's theory of constructivist learning.`,
`Knowledge always builds on existing knowledge • Piaget's theory of constructivist learning`);

M(1,`L08`,3,`Hands-on / Interactive Exhibit`,
`According to the lecture, a hands-on or interactive exhibit is one which:`,
[`Involves physical interaction, has clear learning objectives, and has a multiplicity of outcomes`,`Uses only touchscreens and has one fixed outcome`,`Is designed for experts and has no learning objectives`,`Exists only online`],
`'hands-on'과 'interactive'는 거의 같은 의미로 쓰이며, 물리적 상호작용 + 명확한 학습 목표 + 다양한 결과(multiplicity of outcomes)를 가진 전시.`,
`'hands-on' or 'interactive' have become largely interchangeable • An exhibit which • involves physical interaction • has clear learning objectives • has a multiplicity of outcomes`);

M(1,`L09`,8,`NMC Horizon Report — Three Horizons`,

M(1,`L11`,27,`Museum without Walls`,

[`"Immediate apprehendability"`,`"Long interaction sequences"`,`"Captive audiences"`,`"Single fixed outcomes"`],

M(2,`L01`,110,`ICOM Constitution 1946`,
`According to the ICOM Constitution (1946), the word "museums" included zoos and botanical gardens but excluded:`,
[`Libraries, except in so far as they maintain permanent exhibition rooms`,`Science centres and planetariums`,`Historical monuments`,`Art galleries`],
`1946 정의: 대중에게 공개된 모든 컬렉션(동물원·식물원 포함)을 포함하되 도서관은 제외 — 단, 상설 전시실을 유지하는 경우는 예외.`,
`The word "museums" includes all collections open to the public, of artistic, technical, scientific, historical or archaeological material, including zoos and botanical gardens, but excluding libraries, except in so far as they maintain permanent exhibition rooms.`);

M(2,`L02`,6,`First Museum Revolution`,

`First Museum Revolution = 19세기 후반의 전문화: 최초의 전문 조직(Museums Association, 1889), 전문 저널(1878), 윤리강령(1918), 교육 프로그램(École du Louvre, 1882), 보존과학(Rathgen Forschungslabor, 1888). "Museology" 용어 도입.`,
`The professionalization of the late 19th century • First national professional organisations (Museums Association, 1889) • First professional training programs (École du Louvre, 1882) … The term "Museology" is introduced`);

M(2,`L02`,11,`Second Museum Revolution`,
`What was "the most fundamental question" raised in the Second Museum Revolution (1960s and 1970s)?`,

`Self-reflection on elitism: a re-evaluation of what museums are actually for • The most fundamental question: "For what does a museum exist?" • Old museology is criticized as too focused on methods, too little on purpose`);

M(2,`L03`,31,`Explicit vs. Tacit Knowledge`,
`Which statement describes tacit knowledge (Bearman, 2008)?`,
[`Hardest to digitize — easiest to lose when staff leave`,`Recorded in catalogues, labels, databases`,`Transferable between people and institutions`,`What CMS and digital surrogates capture well`],

M(2,`L03`,37,`Threefold Store — Invisible Store`,
`In the "Threefold Store of Information and Knowledge," the "invisible store of knowledge" is:`,
[`In the minds of the people who are responsible for the care and presentation of the collections`,`The objects immediately visible in the galleries`,`The material of which objects are composed`,`The museum's website and social media`],

`An invisible store of knowledge • in the minds of the people who are responsible for the care and presentation of the collections • made visible in the form of products that help visitors to relate to what they see before them`, `threefold`);

M(2,`L03`,36,`Threefold Store — Embodied Information`,

M(2,`L04`,32,`CIDOC-CRM`,
`How does CIDOC-CRM differ from Dublin Core?`,
[`CIDOC-CRM models information around events (event-based ontology); Dublin Core is flat and attribute-based`,`CIDOC-CRM is general-purpose; Dublin Core is domain-specific for cultural heritage`,`CIDOC-CRM has 15 elements; Dublin Core has 12`,`CIDOC-CRM is a file format; Dublin Core is a scanner`],
`CIDOC-CRM: 문화유산 domain-specific 표준, 사건 중심(event-based ontology)으로 관계 네트워크 구축 (예: Production Event가 꽃병·제작자·시대·장소·기법을 role로 연결). ISO 21127. Dublin Core는 general-purpose, flat, attribute-based.`,
`Core idea: models information around events, not a flat list of attributes • Example: a Production Event links a vase, its maker, period, place, and technique as roles • ISO 21127 · first adopted 2006, most recent revision 2023`);

M(2,`L04`,41,`Separation of Content from Presentation`,
`Which is a benefit of separating content from presentation in an exhibit?`,
[`Change the interface design without reproducing all the content in the installation`,`Store every asset at the lowest possible quality`,`Merge content and presentation into one file`,`Remove the need for metadata`],
`Separation of Content from Presentation의 이점: 프레젠테이션 후반작업 없이 콘텐츠 추가 / 프레젠테이션 재설계 없이 삭제 / 콘텐츠 재생산 없이 인터페이스 디자인 변경 / 다른 설치물에서 콘텐츠 재사용.`,
`Change the interface design without reproducing all the content in the installation`);

M(2,`L04`,44,`DAM vs. CMS`,
`Which correctly distinguishes DAM from CMS?`,
[`DAM organizes and manages all digital content; CMS manages content typically at the presentation layer of a digital endpoint (such as website)`,`DAM manages websites; CMS manages raw images`,`DAM is a metadata standard; CMS is a scanner`,`DAM and CMS are identical terms`],
`DAM(S): 모든 디지털 콘텐츠(이미지, 영상, 텍스트, 3D 등)를 조직·관리. CMS: 디지털 엔드포인트(웹사이트 등)의 presentation layer에서 콘텐츠 관리.`,
`DAM (Digital Asset Management); DAMS (DAM System) • a system that organizes and manages all digital content (such as images, videos, text, 3D objects, etc.) | CMS (Content Management System) • a system that manages content, typically at the presentation layer, of a digital endpoint (such as website)`);

M(2,`L04`,55,`Components of CMS`,
`Among the components of a CMS, which one "enables different databases and software applications to communicate (compatibility)"?`,
[`API (Application Programming Interface)`,`Metadata`,`Interface`,`Database`],
`CMS 구성요소: Database, Metadata(전시 맥락에서 객체에 대한 정보 그룹), Interface(Hardware 예: touchscreen, GUI), API(서로 다른 DB와 소프트웨어 간 통신 — 호환성).`,
`API (Application Programming Interface) enables different databases and software applications to communicate (compatibility)`);

M(2,`L04`,89,`Migration`,
`Which is listed as a drawback of the migration strategy?`,
[`Risk of loosing original data in a migration process, and high cost and continuous effort`,`It cannot preserve the "look-and-feel"... because it needs the original hardware`,`It is only a short-term strategy with no bit changes`,`It requires encapsulating every object with decoding information`],
`Migration: 사용자가 변하는 기술 환경에서 자원을 검색·사용 가능. 단점: 마이그레이션 과정에서 원본 데이터 손실 위험, 장기 보존을 위한 높은 비용과 지속적 노력. (슬라이드 철자 "loosing" 그대로)`,
`User can search and use digital resources in a changing technological environment • Risk of loosing original data in a migration process • High cost and continuous effort for long-term preservation`);

M(2,`L04`,92,`Encapsulation`,
`Which preservation strategy creates "self-describing objects"?`,
[`Encapsulation`,`Refreshing`,`Migration`,`Emulation`],
`Encapsulation: 디지털 객체를 그것을 해독·이해하는 데 필요한 모든 정보와 함께 캡슐화 → self-describing objects. 특정 보존 전략에 종속되지 않음.`,
`Encapsulating the digital object with all of the information needed to decode and understand it • Not specific to any particular preservation strategy • Self-describing objects`);

M(2,`L04`,97,`OAIS`,
`OAIS is defined as "An archive, consisting of an organization of people and systems, that has accepted the responsibility to preserve information and make it available for a ...":`,
[`Designated Community`,`General Public`,`Producer Network`,`Memory Institution`],
`OAIS 정의: 정보를 보존하고 "Designated Community(지정 공동체)"가 이용할 수 있도록 할 책임을 맡은 사람과 시스템의 조직. ISO 14721:2003으로 채택.`,

M(2,`L06`,11,`Nyquist–Shannon Sampling Theorem`,
`According to the Nyquist–Shannon Sampling Theorem, to reconstruct a continuous signal without loss, the sampling frequency must be:`,
[`At least twice the highest frequency component of the signal`,`Equal to the highest frequency component`,`Half of the highest frequency component`,`At least ten times the lowest frequency component`],
`f_s ≥ 2·f_max. 이미지에서 "highest frequency component"는 원본의 가장 작은 식별 가능한 디테일(균열, 직조 실)에 해당 → 캡처 해상도는 물리적 디테일 크기에서 도출해야 함.`,
`To reconstruct a continuous signal without loss, the sampling frequency must be at least twice the highest frequency component of the signal`, `nyquist`);

M(2,`L06`,32,`Sampling vs. Quantization in Imaging`,
`In digital imaging, which is decided by the sampling rate, and which by the value of each sample?`,
[`Sampling rate → spatial resolution; value of each sample → color depth`,`Sampling rate → color depth; value of each sample → spatial resolution`,`Both decide file format`,`Sampling rate → compression; value → metadata`],
`Sampling은 이미지의 공간 영역을 이산화하며 sampling rate가 spatial resolution을 결정. 각 샘플의 값(Quantization)이 color depth를 결정.`,
`Sampling • discretizes spatial area of an image • Sampling rate decides the spatial resolution • A value of each sample decides the color depth (Quantization)`);

M(2,`L06`,21,`Myth of "Digital Has No Loss"`,
`Which statement about loss in digital media is correct according to the lecture?`,
[`Digital copying is theoretically lossless, but repeatedly re-compressing a JPEG accumulates artifacts due to irreversible DCT quantization`,`Digital signals always degrade with every copy, like videotape`,`Lossy compression never causes information loss`,`Analog copies are exact because they only need to clear a binary threshold`],
`Analog: 복사할 때마다 노이즈 누적(Generational Loss). Digital: 이진 임계값만 넘으면 정확히 재생 → 이론상 무손실 복사. 그러나 손실 압축·포맷 변환은 정보 손실을 일으킴(JPEG 재압축 시 DCT 양자화로 artifact 누적).`,
`Digital signals only need to clear a binary threshold to be reproduced exactly, so copying is theoretically lossless indefinitely. Lossy compression and format conversion do cause information loss — repeatedly re-compressing a JPEG accumulates artifacts similar to generational loss, due to irreversible DCT quantization.`);

M(2,`L06`,45,`Triangulation Scanner`,
`A short-range scanner that "shines a laser pattern onto the subject and exploits a camera to look for the location of the laser's projection on the object" uses which principle?`,
[`Triangulation`,`Time-of-Flight`,`Phase-Shift`,`Photogrammetry`],
`Short Range Scanners: Triangulation Type — 레이저 패턴을 쏘고 카메라로 물체 위 레이저 투영 위치를 찾는다. Time-of-Flight, Phase-Shift는 Long Range Scanners.`,
`Triangulation principle • shines a laser pattern onto the subject and exploits a camera to look for the location of the laser's projection on the object.`, `triang`);

M(2,`L06`,68,`Aerial vs. Close-Range Photogrammetry`,
`Which describes close-range photogrammetry (as opposed to aerial photogrammetry)?`,
[`Imaging system is handheld; target is the object being measured; data processed to make precise measurements`,`Imaging system is based on an aircraft or spacecraft; target is the ground surface`,`Used for mapping Earth or planets`,`Image data is processed to create new spatial information products`],
`Close-Range: 산업 측정용, handheld 촬영, 측정 대상 물체가 타깃, 정밀 측정. Aerial: 지구·행성 매핑, 항공기·우주선 기반, 지표면이 타깃, 새로운 공간정보 산출물 생성.`,
`Close-Range Photogrammetry • Used for industrial measurement • Imaging system is handheld • Target is the object being measured • Image data is processed to make precise measurements`, `aerial`);

M(2,`L10`,50,`Infrared Triggers`,
`Which statement about infrared (IR) tags or triggers is correct?`,
[`It is a line-of-sight technology, and proximity to natural light can degrade the beam`,`It does not require line-of-sight and has a range up to 10m`,`It uses magnetic field induction at 4 inch or less`,`It is based on GPS satellites`],
`IR: 천장이나 문 위의 트리거가 지나가는 방문객에게 콘텐츠 재생. Line-of-sight 기술(트리거와 수신기 사이 깨끗한 경로 필요). 자연광에 가까우면 신뢰성 저하.`,

M(2,`HCI`,21,`Social Context — Presence of Other Visitors`,
`According to Hornecker & Ciolfi, what can happen when visitors observe other visitors at an interactive exhibit?`,
[`It can remove the suspense or surprise of interactive exhibits that only have one outcome`,`It always reduces understanding of how the exhibit works`,`It forces visitors to finish the interaction`,`It has no effect on the experience`],
`다른 방문객 관찰은 결과가 하나뿐인 인터랙티브 전시의 서스펜스·놀라움을 없앨 수 있지만, 작동 방식을 이해하는 데 도움이 될 수도 있다. 방문객은 중간에 떠나거나 중간에 합류할 수 있다.`,

M(2,`HCI`,42,`Contextually Embedded`,
`"Contextually embedded" interactives (Hornecker, 2016) are:`,
[`Interactives that are highly integrated with the museum environment and surrounding artefacts`,`Interactives placed in a separate digital room away from artefacts`,`Apps that can only be used at home`,`Installations with long interaction sequences`],
`Pujol-Tost(2011): 인터랙티브 전시는 전시 유물과의 공간적·개념적 관계가 부족해 실패하기 쉽다. Hornecker(2016): "Contextually embedded" = 박물관 환경과 주변 유물에 고도로 통합된 인터랙티브 → 디지털 콘텐츠와 주변 전시물 간 연결을 유도.`,
`"Contextually embedded" • Interactives that are highly integrated with the museum environment and surrounding artefacts Hornecker, 2016 • Contextually embedded installations invite visitors to draw connections between the content provided by a digital installation and surrounding exhibits`);

M(2,`HCI`,8,`Free-choice Learning`,

[`Fundamentally different to school learning — visitors learn what they want to learn and do not follow an external agenda`,`Identical to formal classroom learning`,`Learning that is always assessed by tests`,`Learning that requires a captive audience`],

M(2,`L02`,38,`Digital Asset Management (L02)`,

`For the preservation of digital assets • The tasks and the decisions surrounding the ingestion, annotation, cataloging, storage, and retrieval of digital assets • Each asset is referenced and managed by its metadata`);

M(2,`L06`,47,`Triangulation Laser Scanning (diagram)`,
`The diagram below shows a laser emitter, a mirror, a lens and an image sensor observing a point on an object. Which scanning principle does it illustrate?`,

`Triangulation principle • shines a laser pattern onto the subject and exploits a camera to look for the location of the laser's projection on the object.`, `triang`, `q_triang`);

M(2,`L04`,95,`DCC Curation Lifecycle Model (diagram)`,

M(2,`L06`,56,`Time-of-Flight (diagram)`,
`The diagram below shows an emitter, a receiver, and a time measurement of the reflected laser. Which scanner type is this, and is it typically short- or long-range?`,

M(3,`L06`,11,`Bit Depth for Preservation Masters`,
`A museum captures preservation master images at 16-bit per channel rather than 8-bit. According to the lecture, why?`,
[`Quantization is an inherently irreversible loss of information, so extra bit depth provides a safety margin for later correction and restoration`,`16-bit files are smaller and easier to store`,`8-bit channels cannot represent any color`,`The Nyquist theorem requires 16 bits for every image`],
`양자화는 본질적으로 되돌릴 수 없는 정보 손실 → 여분의 bit depth가 이후 보정·복원의 안전 여유를 제공. SQNR: 8-bit ≈ 50dB, 16-bit ≈ 98dB.`,
`Why preservation master images are captured at 16-bit per channel rather than 8-bit. Quantization is an inherently irreversible loss of information, so extra bit depth provides a safety margin for later correction and restoration.`, `nyquist`);

M(3,`L06`,11,`SQNR`,
`Using SQNR(dB) ≈ 6.02n + 1.76 (n = bit depth), approximately what SQNR does a 16-bit channel achieve?`,
[`≈ 98 dB`,`≈ 50 dB`,`≈ 16 dB`,`≈ 196 dB`],
`6.02×16 + 1.76 ≈ 98.1 dB. 8-bit은 6.02×8+1.76 ≈ 49.9 ≈ 50 dB.`,
`SQNR(dB) ≈ 6.02n + 1.76 | 8-bit channel ≈ 50dB 16-bit channel ≈ 98dB | n = bit depth`, `nyquist`);

M(3,`L06`,5,`ADC Resolution`,
`An n-bit ADC divides the full-scale voltage V_FS into 2ⁿ levels. For a 10-bit ADC with V_FS = 1.024 V, the minimum resolution (LSB) is:`,
[`1 mV`,`10 mV`,`0.1 mV`,`102.4 mV`],
`LSB = V_FS / 2ⁿ = 1.024 V / 1024 = 0.001 V = 1 mV. n이 클수록 더 미세한 신호 변화를 분해할 수 있다.`,
`ADC Resolution and Bit Depth 2ⁿ quantization levels · minimum resolution (LSB) = V_FS / 2ⁿ • An n-bit ADC divides the full-scale voltage into 2ⁿ equal levels — the larger n is, the finer the signal variation it can resolve`);

M(3,`L06`,11,`Nyquist in Museum Practice`,
`A textile has woven threads 0.2 mm apart, the smallest detail that must be identifiable. According to the lecture, how should capture resolution be chosen?`,
[`Derived from the physical detail size of the object — sampling at least twice per smallest detail (≤ 0.1 mm per sample)`,`Chosen arbitrarily based on camera defaults`,`Set to the screen resolution of the museum website`,`Set so that each thread is captured by exactly one sample`],
`이미지의 "highest frequency component" = 원본의 가장 작은 식별 가능한 디테일. Nyquist(f_s ≥ 2·f_max)에 따라 디테일 하나당 최소 2 샘플 → 0.2 mm 간격이면 0.1 mm 이하/샘플. 해상도는 임의로 정하지 말고 물리적 디테일 크기에서 도출.`,
`An image's "highest frequency component" corresponds to the smallest identifiable detail of the original (a crack, a woven thread) — capture resolution should be derived from the physical detail size of the object, not chosen arbitrarily`, `nyquist`);

M(3,`L06`,56,`Time-of-Flight Calculation`,
`A Time-of-Flight laser scanner measures a time difference of 20 ns between emission and reception (c ≈ 3×10⁸ m/s). Using D = c·t/2, what is the distance to the target?`,
[`3 m`,`6 m`,`1.5 m`,`60 m`],
`D = (3×10⁸ × 20×10⁻⁹)/2 = 6/2 = 3 m. 왕복 시간이므로 2로 나눈다.`,
`Time-of-Flight Laser Scanner Principle | Time of flight (time difference between emission and reception) | Speed of light | D = c·t/2`, `tof`);

M(3,`L06`,58,`Phase-based Measurement`,
`In a phase-shift scanner, the distance is computed as:`,
[`D = c·Δφ / (4π·f_mod)`,`D = c·t`,`D = Δφ / (2π·f_mod)`,`D = 2·c·f_mod / Δφ`],
`Phase-based: t = Δφ/(2π·f_mod), D = c·t/2 = c·Δφ/(4π·f_mod). Δφ: Phase shift, f_mod: modulation frequency.`,
`Phase-based Measurement Principle | t = Δφ / (2π·f_mod) | D = c·t/2 = c·Δφ / (4π·f_mod) | ΔΦ: Phase shift, f_mod: modulation frequency, t: Time`, `phase`);

M(3,`L06`,40,`Scanner Types`,

M(3,`L06`,66,`SfM Pipeline`,
`What is the correct order of the 4-stage Structure from Motion pipeline?`,
[`Feature Detection & Matching → Camera Pose Estimation → Sparse Reconstruction & Bundle Adjustment → Dense Reconstruction (MVS)`,`Camera Pose Estimation → Feature Detection → Dense Reconstruction → Bundle Adjustment`,`Dense Reconstruction → Sparse Reconstruction → Feature Detection → Camera Pose Estimation`,`Bundle Adjustment → Feature Detection → Mesh → Camera Pose Estimation`],
`SfM 4단계: (1) SIFT/SURF/ORB로 특징점 추출·매칭 → (2) 대응점으로 각 사진의 카메라 위치·방향 역산 → (3) Sparse Reconstruction & Bundle Adjustment(Levenberg–Marquardt 비선형 최소제곱) → (4) Multi-View Stereo로 조밀화해 최종 mesh·texture.`,
`Structure from Motion — the 4-Stage Processing Pipeline 1 Feature Detection & Matching › 2 Camera Pose Estimation › 3 Sparse Reconstruction & Bundle Adjustment › 4 Dense Reconstruction (MVS)`, `sfm`);

M(3,`L06`,66,`Bundle Adjustment Solver`,
`In the SfM pipeline, bundle adjustment is solved as which kind of problem?`,
[`A nonlinear least-squares problem that jointly optimizes all camera parameters and 3D point coordinates (Levenberg–Marquardt)`,`A linear sorting problem solved by binary search`,`A classification problem solved by a neural network`,`A compression problem solved by DCT`],
`3단계 Sparse Reconstruction & Bundle Adjustment: 모든 카메라 파라미터와 3D 점 좌표를 함께 최적화하는 비선형 최소제곱 문제(Levenberg–Marquardt).`,
`A nonlinear least-squares problem that jointly optimizes all camera parameters and 3D point coordinates (Levenberg–Marquardt)`, `sfm`);

M(3,`L04`,90,`Emulation (scenario)`,
`A museum wants visitors to play a 1990s MS-DOS artwork on Windows 10 exactly as it originally looked and behaved. Which strategy fits, and what benefit does the lecture list for it?`,
[`Emulation — it retains 'look-and-feel' and preserves (and uses) the original bits`,`Migration — it converts the file into PDF`,`Refreshing — it copies bits to the same type of medium`,`Encapsulation — it deletes the old software`],
`Emulation: 구 소프트웨어·하드웨어의 동작을 복사하는 새 소프트웨어를 만들어 물리적 존재·콘텐츠·기능의 원본성 보장. 장점: 원본 비트 보존·사용, 'look-and-feel' 유지, 주기적 객체 변환 필요 감소, 실행 코드 의존 객체에 가능, 포맷 '이해' 덜 필요.`,
`Creation of new software that can copy the operations of older software and hardware to ensure its originality in terms of physical presence, content and functionality | Benefits: • Technique already widely used • Preserves (and uses) the original bits • Retains 'look-and-feel'`, `emul`);

M(3,`L04`,88,`Migration (scenario)`,
`An archive converts its collection of Word documents to PDF and moves from Windows to GNU/Linux. This is:`,
[`Migration`,`Refreshing`,`Emulation`,`Encapsulation`],
`Migration = 데이터 이전: 구 시스템 환경→새 환경(Windows→GNU/Linux), 파일 포맷 간(Word→PDF), 프로그래밍 언어 간. Refreshing은 같은 종류 매체 간 비트 복사.`,
`Transferring the data • from old system environment to new one (e.g. Windows to GNU/Linux); • from one file format to another format, (e.g. Word to PDF); and • from one programming language to another`);

M(3,`L04`,105,`OAIS Functional Entities`,

M(3,`L04`,101,`OAIS Ingest`,

M(3,`L04`,100,`OAIS — Preservation Description Information`,

M(3,`L04`,28,`Dublin Core Elements`,

`"Continuity of the digital heritage is fundamental... Long-term preservation of digital heritage begins with the design of reliable systems and procedures which will produce authentic and stable digital objects." Which article is this?`,
[`Article 5 – Digital continuity`,`Article 2 – Access to the digital heritage`,`Article 1 – Scope`,`Article 10 – Roles and responsibilities`],
`Article 2: 디지털 유산 보존의 목적은 대중 접근 보장, 불합리한 제한 없는 접근, 민감·개인 정보 보호. Article 5: 디지털 연속성 — 생성부터 접근까지 생애주기 전반의 조치.`,
`Article 5 – Digital continuity | Continuity of the digital heritage is fundamental. To preserve digital heritage, measures will need to be taken throughout the digital information life cycle, from creation to access.`);

M(3,`L04`,84,`Digital Preservation (ALA)`,
`According to the American Library Association's medium definition, what is "the goal of digital preservation"?`,
[`The most accurate rendering possible of authenticated content over time`,`The cheapest storage of content`,`The fastest delivery of content to the web`,`The conversion of all content to analog`],
`ALA medium definition: 파일 손상, 매체 고장, 기술 변화에도 불구하고 born digital 또는 디지털 변환 콘텐츠에 접근을 보장 — 목표는 "the most accurate rendering possible of authenticated content over time".`,
`Digital preservation combines policies, strategies and actions to ensure access to content that is born digital or converted to digital form regardless of the challenges of file corruption, media failure and technological change. The goal of digital preservation is the most accurate rendering possible of authenticated content over time.`);

M(3,`L04`,81,`Digital Preservation (Hedstrom)`,
`"The planning, resource allocation, and application of preservation methods and technologies necessary to ensure that digital information of continuing value remains accessible and usable." Whose definition is this?`,
[`M. Hedstrom`,`American Library Association`,`Digital Curation Centre`,`UNESCO`],
`이 정의는 M. Hedstrom의 Digital Preservation 정의. ALA는 "policies, strategies and actions" 정의(short/medium).`,
`The planning, resource allocation, and application of preservation methods and technologies necessary to ensure that digital information of continuing value remains accessible and usable. - M. Hedstrom`);

M(3,`L04`,94,`Digital Curation`,
`Which is the lecture's definition of digital curation?`,
[`Maintaining, preserving and adding value to digital assets throughout its lifecycle`,`Converting analog signals into binary code`,`Selling digital reproductions of artworks`,`Copying data between two types of the same storage medium`],
`Digital curation = 디지털 자산의 생애주기 전반에 걸친 유지·보존·가치 부가. DCC: "Maintaining and adding value to a trusted body of information for current and future use".`,
`Digital curation involves maintaining, preserving and adding value to digital assets throughout its lifecycle.`, `dcc`);

M(3,`L02`,29,`ICOM 2022 Definition`,
`Which verb appears in the ICOM 2007 definition but NOT in the 2022 Prague definition?`,
[`acquires`,`collects`,`conserves`,`exhibits`],
`2022: "researches, collects, conserves, interprets and exhibits tangible and intangible heritage". 2007: "acquires, conserves, researches, communicates and exhibits". acquires와 communicates(기능 목록에서)가 빠지고 collects, interprets가 들어갔다.`,
`A museum is a not-for-profit, permanent institution in the service of society that researches, collects, conserves, interprets and exhibits tangible and intangible heritage. Open to the public, accessible and inclusive, museums foster diversity and sustainability.`, `icom22`);

M(3,`L02`,29,`ICOM 2022 Definition — Purposes`,
`According to the 2022 ICOM definition, museums offer varied experiences for:`,
[`education, enjoyment, reflection and knowledge sharing`,`education, study and enjoyment`,`study, education and delectation`,`research, profit and tourism`],
`2022: "offering varied experiences for education, enjoyment, reflection and knowledge sharing." 2007은 "for the purposes of education, study and enjoyment".`,
`They operate and communicate ethically, professionally and with the participation of communities, offering varied experiences for education, enjoyment, reflection and knowledge sharing.`, `icom22`);

M(3,`L02`,30,`Kyoto's Failure`,
`Which is listed as a reason for the failure of the 2019 Kyoto proposal?`,
[`A lack of democratic procedures — a text distributed six weeks before the vote vs. an 18-month, participatory process across 126 countries`,`It contained too few social values`,`It removed the word "museum"`,`It was written only in French`],
`Kyoto 실패 이유: 1) 이념적 표현과 전통적 기능 기술의 균형 문제, 2) 민주적 절차 부족(투표 6주 전 배포 vs. 2022는 126개국 18개월 참여 과정), 3) 지역 박물관 간 근본적 차이.`,
`Kyoto's failure stemmed from 1. the challenge of striking a balance between ideological expression and descriptions of traditional functions, 2. a lack of democratic procedures, and a text distributed six weeks before the vote vs. an 18-month, participatory process across 126 countries 3. fundamental differences among regional museums.`, `icomtl`);

M(3,`L01`,114,`Evolution of ICOM Definitions`,
`In which version of the ICOM Statutes were "science centres and planetariums" first listed as complying with the museum definition, according to the slides?`,
[`1974 (Copenhagen)`,`1946 (Constitution)`,`1951`,`2007 (Vienna)`],
`1946: 동물원·식물원 포함, 도서관 제외 / 1951: 식물원·동물원·수족관, 상설 전시실 있는 공공 도서관·아카이브 포함 / 1961: natural reserves 등 / 1974: e. science centres and planetariums 추가.`,
`ICOM Statutes, adopted by the 11st General Assembly (Copenhagen, Danemark, 14 June 1974) … e. science centres and planetariums.`);

M(3,`L01`,117,`2001 Amendment — Intangible Heritage`,
`Which category was added in the 2001 (Barcelona) amendment of the ICOM Statutes, reflecting "intangibility"?`,
[`Cultural centres and other entities that facilitate the preservation, continuation and management of tangible or intangible heritage resources (living heritage and digital creative activity)`,`Botanical and zoological gardens and aquariums`,`Science centres and planetaria`,`Public libraries maintaining permanent exhibition rooms`],
`2001 개정의 viii: 유·무형 유산 자원(living heritage and digital creative activity)의 보존·지속·관리를 촉진하는 문화센터 등. Virtual Museum 강의에서 'intangibility' 도입 논쟁으로 다시 인용.`,
`viii. cultural centres and other entities that facilitate the preservation, continuation and management of tangible or intangible heritage resources (living heritage and digital creative activity);`);

M(3,`L03`,75,`Powerhouse Museum OPAC2.0`,
`In the Powerhouse Museum's "OPAC2.0" (2006), 95% of published objects were viewed at least once in the first month. What does the lecture say this figure shows?`,
[`The "invisible store of knowledge" made visible at scale — most of a collection is normally seen only by staff`,`That folksonomy decreased user corrections`,`That only 5% of the collection was digitized`,`That visitors preferred physical visits to online catalogues`],
`62,000+ 레코드(소장품 70%+)를 CMS(EMu)에서 공공 카탈로그로 자동 게시, 첫 6주 239,001명·120만 조회. folksonomy로 방문객이 태그 → 기존 레코드 수정이 3배. 95%는 평소 직원만 보던 컬렉션이 거의 하룻밤 사이에 공개되었음을 보여준다.`,
`The 95% figure is the "invisible store of knowledge" made visible at scale: most of a collection is normally seen only by staff — opening the CMS reversed that almost overnight.`);

M(3,`L03`,83,`More Difficult Shift`,
`Why was the shift to the Web "a more difficult shift than for library and archive" for museums?`,
[`Museum collections data was designed primarily for internal use and generally not a ready fit for the World Wide Web`,`Museums had no computers until 2000`,`Libraries refused to share standards with museums`,`Museum objects cannot be photographed`],
`박물관 컬렉션 데이터는 주로 내부용으로 설계되어 WWW에 바로 맞지 않았다. 1990년대 혁신(저가 멀티미디어 도구, 인터넷 확산) 속 "being about something" → "being for somebody" 전환.`,
`A more difficult shift than for library and archive • Museums collections data designed primarily for internal use • generally not a ready fit for the World Wide Web`);

M(3,`L03`,81,`Transition of Modern Museums`,
`In the slide on innovation in the 1990s, "the care and study of collections" corresponds to "being about something." What corresponds to "being for somebody"?`,
[`"the delivery of a public service"`,`"the accumulation of objects"`,`"the professionalization of staff"`,`"the computerization of registration"`],
`The transition of modern museums: "being about something" = "the care and study of collections" → "being for somebody" = "the delivery of a public service".`,
`The transition of modern museums "being about something" "being for somebody" "the care and study of collections" "the delivery of a public service"`);

M(3,`L03`,62,`Disadvantages (scenario)`,
`A curator worries that putting high-resolution images online will make people feel they "have seen" the painting and stop visiting, and that the online copy lacks the original's presence. Which two listed disadvantages match?`,
[`The potential impact on physical museum visitation; the potential lessening of the "aura" or authenticity`,`Copyright and intellectual property; the blurring of museum identities online`,`Remote access; narrowcasting`,`Infinite perfect copies; hypermedia`],
`Disadvantages: copyright and IP / the potential lessening of the "aura" or authenticity / the blurring of individual museum identities online / the risk of losing individual details and lessening a sense of reality / the potential impact on physical museum visitation.`,
`the potential lessening of the "aura" or authenticity, • the blurring of individual museum identities online, • the risk of losing individual details and lessening a sense of reality, and • the potential impact on physical museum visitation`);

M(3,`L08`,33,`12 Factors (classification)`,
`"Subsequent reinforcing events and experiences outside the museum" belongs to which context of the 12 factors?`,
[`Physical context`,`Personal context`,`Sociocultural context`,`It is not one of the 12 factors`],
`의외로 Physical context의 12번째 요소. 12 factors: Personal(1-5), Sociocultural(6 Within group social mediation, 7 Mediation by others outside the immediate social group), Physical(8 Advance organizers ~ 12 Subsequent reinforcing events…).`,
`Physical context 8. Advance organizers 9. Orientation to the physical space 10. Architecture and large-scale environment 11. Design and exposure to exhibits and programs 12. Subsequent reinforcing events and experiences outside the museum`, `ctx12`);

M(3,`L08`,33,`12 Factors (scenario)`,
`A docent who is not part of a family group explains a fossil to them. In the 12 factors, this is:`,
[`Mediation by others outside the immediate social group (Sociocultural context)`,`Within group social mediation (Sociocultural context)`,`Advance organizers (Physical context)`,`Choice and control (Personal context)`],
`가족 외부의 도슨트·직원 등에 의한 매개 = 7. Mediation by others outside the immediate social group. 가족·친구 간 상호작용 = 6. Within group social mediation.`,
`Sociocultural context 6. Within group social mediation 7. Mediation by others outside the immediate social group`, `ctx12`);

M(3,`L10`,18,`Mobile Design Requirements (scenario)`,
`A mobile guide's designers want to help Browsers become Followers. Which requirement from the lecture addresses this?`,
[`Visually arresting objects should be incorporated in order to help Browsers transition to Followers (Morris, Hargreaves, and McIntyre 2004)`,`The use of specialist language should be avoided (Fisher 2005)`,`When using multimedia, the audio and video must be coherent (Proctor and Tellis 2003)`,`Technology should be easy to use and unobtrusive (Hawkey 2004)`],
`Browsers는 경외감을 주는 시각적으로 인상적인 객체를 선택하므로, visually arresting objects를 통합하면 Followers(내러티브 주제를 따르는 방문객)로 전환을 돕는다.`,
`Visually arresting objects should be incorporated in order to help Browsers transition to Followers (Morris, Hargreaves, and McIntyre 2004).`);

M(3,`L10`,18,`Mobile Design Requirements (attribution)`,
`"Technology should be easy to use and unobtrusive; it should enable the experience rather than detract from it" is attributed to:`,
[`Hawkey 2004`,`Fisher 2005`,`Falk and Dierking 2000`,`Proctor and Tellis 2003`],
`Hawkey(2004): 기술은 쉽고 눈에 띄지 않아야 함. Fisher(2005): 콘텐츠는 객체와 함께 작동/전문용어 피하기/퀴즈·놀이. Falk & Dierking(2000): 선택권 제공. Proctor & Tellis(2003): 오디오·비디오 일관성.`,
`Technology should be easy to use and unobtrusive; it should enable the experience rather than detract from it (Hawkey 2004).`);

M(3,`L10`,16,`Visitor Modes (scenario)`,
`A visitor opens the museum app and types "Goryeo celadon" to find all related objects instead of following a themed tour. This visitor is a:`,
[`Searcher`,`Follower`,`Browser`,`Researcher`],
`Searchers: 특정 컬렉션·전시 정보를 수집하며 thematic narrative보다 keyword로 검색. Researchers는 특정 객체의 상세·학술 정보와 관련 컬렉션 위치까지 추구.`,
`3. Searchers gather information on particular collections or exhibitions. They are likely to search by keyword rather than by thematic narrative.`);

M(3,`L10`,53,`Location Technology (scenario)`,
`A museum with large glass walls and strong daylight needs automatic triggering for visually-impaired visitors without requiring them to point a device. Which technology best fits the lecture's description?`,
[`Bluetooth tags — up to 10m, no line-of-sight, "a very powerful solution for visually-impaired visitors"`,`Infrared triggers — line-of-sight, degraded by natural light`,`GPS triggering — outdoors only`,`Manual content navigation — keypad entry`],
`IR은 line-of-sight이며 자연광에 약함. GPS는 실외용. Bluetooth tags는 10m 범위, line-of-sight 불필요, 시각장애 방문객에게 강력한 솔루션.`,
`Bluetooth Tags • the same way as infrared tags, but have a larger range (up to 10m/30ft), and do not require line-of-sight • a radio-based technology • … • a very powerful solution for visually-impaired visitors`);

M(3,`L10`,49,`WLAN Positioning Process`,
`How does WLAN software-based positioning determine a visitor's location?`,
[`A radio map of signal strength is related to an architectural map, the server triangulates, often combined with IR, Bluetooth or radio triggers for finer positioning`,`Each object has a 4-inch NFC tag read by magnetic induction`,`Ultrasonic sensors suspended over the space`,`GPS satellites track the visitor indoors`],
`전시 공간의 radio map(신호 강도)을 만들고 건축 도면과 연결 → 서버가 위치를 삼각측량. 더 정밀한 위치를 위해 IR, Bluetooth, Radio Triggers와 결합.`,
`The exhibition space's radio map is created • 'signal strength' or radio map is then related to an architectural map of the exhibition area • The server can triangulate each visitor's location • Usually combined with Infrared(IR), Bluetooth or Radio Triggers for finer positioning`);

M(3,`HCI`,32,`Levels of Immersion`,
`In the involvement model (Blumenthal & Jensen, 2019) adapted in the lecture, what is the order of the levels of involvement?`,
[`Engagement → Engrossment → Transcending involvement`,`Engrossment → Engagement → Immersion → Attention`,`Immersion → Engagement → Engrossment`,`Attention → Interest → Desire → Action`],
`Level of involvement: Engagement → Engrossment → Transcending involvement(Immersion). 강의에서 HCI 요소: Engagement = Aesthetic(Visual/Auditory stimuli), Intuitiveness, Predictability, Transparency / Engrossment = Intuitive UI/UX, Useful and rich information, Difficulty balancing, Context-based design.`,
`Level of involvement | Engagement | Engrossment | Transcending involvement`, `immersion`);

M(3,`HCI`,32,`HCI Factors for Engrossment`,
`In the lecture's adaptation of the immersion model, which group of HCI factors is placed at the "Engrossment" stage?`,
[`Intuitive UI/UX, Useful and rich information, Difficulty balancing, Context-based design`,`Aesthetic (Visual/Auditory stimuli), Intuitiveness, Predictability, Transparency (low technology barrier)`,`Ticket price, opening hours, café, toilets`,`SIP, AIP, DIP`],
`Engagement 단계: Aesthetic(Visual/Auditory stimuli), Intuitiveness, Predictability, Transparency(low technology barrier). Engrossment 단계: Intuitive UI/UX, Useful and rich information, Difficulty balancing, Context-based design. 전 과정에 "HCI in the design process".`,
`Aesthetic(Visual/Auditory stimuli) Intuitiveness Predictability Transparency(low technology barrier) | Intuitive UI/UX Useful and rich information Difficulty balancing Context-based design | HCI in the design process`, `immersion`);

M(3,`HCI`,28,`Immersion Process Models`,
`Which pairing of immersion process model and author is correct?`,
[`A cyclical or immediate process — Carù & Cova (2005)`,`A sequential process — Hansen & Mossberg (2013)`,`A dynamic process — Brown & Cairns (2004)`,`A sequential process — Falk & Dierking (2000)`],
`Sequential process(Brown & Cairns, 2004) / Cyclical or immediate process(Carù & Cova, 2005) / Dynamic process(Hansen & Mossberg, 2013). 몰입 → memorable tourism experiences → positive emotions, intentions to revisit.`,
`A sequential process (Brown & Cairns, 2004) | A cyclical or immediate process (Carù & Cova, 2005) | A dynamic process (Hansen & Mossberg, 2013)`);

M(3,`HCI`,40,`ArtLens Wall`,
`Which set lists the effective factors developed from the HCI design for the ArtLens Wall at the Cleveland Museum of Art?`,
[`Visual effect, Curation (Thematic grouping), Personal experience, Personalization`,`Low price, Large screen, Long videos, Single user`,`RFID, NFC, GPS, Beacon`,`Refreshing, Migration, Emulation, Encapsulation`],

M(3,`HCI`,26,`Lab-based Usability Testing`,
`Why is a traditional lab-based usability test insufficient for museum interactives?`,
[`It is hard to predict whether visitors will approach, try, and persist, or get distracted by other things in the vicinity; installations attractive without competition may fail in a museum`,`Labs cannot run touchscreens`,`Visitors in museums are captive learners`,`Museum interactives always have short sequences`],
`실험실 테스트는 방문객이 다가가 시도하고 가치를 느껴 지속할지, 주변 다른 것에 끌려갈지 예측하기 어렵다. 경쟁 없이 매력적인 장치도 박물관에서는 실패할 수 있다. 긴 상호작용 시퀀스는 중간 이탈 문제.`,
`In a traditional lab-based usability test, it is hard to predict whether visitors will approach the interactive, try it out, and see enough value to persist, or get distracted and attracted by other things in the vicinity. • Devices or installations that are attractive for use at home or in school learning, or that are considered attractive when experienced without competition, may fail in a museum context`);

M(3,`HCI`,17,`HCI in Context — Typologies`,
`According to Hornecker & Ciolfi (2019), why is interaction design based on establishing typologies of users "not likely to lead to effective designs" in museums?`,
[`Visitor motivations may change and vary highly, so designs must allow flexibility for visitors to adjust the experience to their evolving interests`,`Museums have only one type of visitor`,`Typologies are illegal in museums`,`Visitors never have motivations`],
`동기는 여러 요인에 따라 변하고 매우 다양하다 → 방문객이 자신의 변화하는 관심에 맞춰 경험(과 콘텐츠)을 조정할 수 있는 유연성과 자유를 허용해야 한다.`,
`Interaction design based on establishing typologies of users in typical HCI work is not likely to lead to effective designs • The motivations may change depending on many factors, and these may highly vary. • Designing interactive visitor experiences must allow for a degree of flexibility, and of freedom for visitors to adjust the experience (and related content) to their own evolving interests.`);

M(3,`HCI`,41,`Considerations for Interactive Installations`,
`Which is NOT listed among the considerations for introducing novel interactive installations into museums?`,
[`Guaranteed increase in ticket revenue`,`Rapid obsolescence of technology`,`Concerns that screens and high-tech installations may distract from the actual artefacts`,`Demands in terms of curation, conservation and archival work`],
`도입 이유: 새로운(젊은) 관객 유치, 혁신적·현대적 이미지. 고려사항: Economic considerations, Rapid obsolescence of technology, 실제 유물에서 주의 분산 우려, "Political" and organisational issues, curation·conservation·archival work 요구.`,
`Considerations • Economic considerations • Rapid obsolescence of technology • Concerns that screens and high-tech installations may distract from the actual artefacts • "Political" and organisational issues • Demands in terms of curation, conservation and archival work`);

M(3,`L11`,66,`Europeana as DLS`,

E(1,`L03`,`18–28`,`Data, Information, Knowledge`,
`Explain the differences between data, information, and knowledge as presented in the Museum Informatics lecture.`,
`Data are recorded (captured and stored) symbols and signal readings — raw facts and figures that on their own have no meaning; they are unorganized and unprocessed. Data is processed into information within a context, which makes it meaningful. Information is a message that contains relevant meaning, implication, or input for decision and/or action; its purpose is to aid in making decisions and/or solving problems. It is what human beings transform their knowledge into when they want to communicate it to other people. Knowledge is what we acquire from our interaction with the world — the results of experience organized and stored inside each individual's own mind; it is the understanding of rules needed to interpret information, and its purpose is value creation.`,

E(1,`L04`,`12–15`,`Types of Metadata`,
`Name the three types of metadata and describe each with its guiding question.`,
`The three types are descriptive, structural, and administrative metadata. Descriptive metadata describes the subject matter of the content and describes a resource for purposes of discovery and identification — "What is it? What is it about? What is it called?" (e.g., Title, Creator, Keywords). Structural metadata models the content types and attributes, e.g., data models, reference data, and relationships between files — "What parts does it have?" Administrative metadata provides information to help manage a resource — "When was it created? Who owns it? What's its status?" It includes preservation metadata, rights management, and technical metadata.`,

E(1,`L06`,`3–10`,`Sampling and Quantization`,
`Digitization is "Sampling + Quantization." Explain each process.`,
`Digitization is a set of processes that convert physical resources to a digital form (binary code). Sampling is the discretization of domains such as time or space: values are extracted from an analog signal by discretizing continuous values at regular intervals. The sampling rate (sampling frequency) is the number of samples per unit time or per unit area; it determines the density or resolution of the data, and a higher sampling rate allows more detailed acquisition. Quantization is the process of discretizing the range of values that the sampled signal values can take — approximating sampled data with a set of possible values. The set size is 2^N, and the bit depth is the number of bits required to store the value of each sample. In imaging, sampling rate decides spatial resolution and quantization decides color depth.`,
[[`Digitization converts physical/analog to binary`,[`binary`,`digital form`,`analog`],[`이진`,`디지털`,`아날로그`]],

 [`Quantization = discretizing the range of values`,[`quantiz`,`range of values`,`approximat`],[`양자화`,`값의 범위`,`근사`]],
 [`Bit depth / 2^N levels`,[`bit depth`,`2^n`,`2n`,`bits`],[`비트`,`색 깊이`,`색심도`]]],
[[`L06`,8,`Discretization of domains such as time or space • Extracting values from an analog signal by discretizing continuous values at regular intervals • Sampling rate or sampling frequency : The number of samples per unit time or per unit area`],[`L06`,10,`The process of discretizing the range of values that the signal values extracted through sampling can take … • The set size is 2N • Bit depth: The size of the set, i.e., the number of bits required to store the value of each sample`]]);

E(1,`L08`,`9–33`,`Contextual Model of Learning`,
`Describe Falk and Dierking's Contextual Model of Learning and give at least one factor for each context.`,
`The Contextual Model of Learning (Falk and Dierking, 2000) is a framework designed to acknowledge, reveal, and organize the museum experience and is the learning theory underpinning interactive exhibitions. It assumes all experience is contextual and involves the interplay of three contexts; museum visits occur at the intersections of the three. The Personal Context includes visit motivation and expectations, prior knowledge, prior experience, prior interests, and choice and control. The Sociocultural Context includes within-group social mediation and mediation by others outside the immediate social group. The Physical Context includes advance organizers, orientation to the physical space, architecture and large-scale environment, design and exposure to exhibits and programs, and subsequent reinforcing events and experiences outside the museum. Together these 12 factors contribute to the quality of a museum experience.`,
