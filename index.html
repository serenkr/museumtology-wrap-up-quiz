E(1,`L10`,`7–9`,`BYOD in Museums`,
`What is BYOD? Describe at least three benefits and three difficulties of BYOD in museums.`,
`BYOD (Bring Your Own Device), also referred to as BYOT, is the practice of people bringing their own laptops, tablets, smartphones, or other mobile devices with them to be productive in learning institutions or at work; Intel coined the term in 2010. Museums are leveraging BYOD policies to meet visitors where they are most comfortable. Benefits include reduced technology costs, familiarity with personal devices, improved user engagement, personalized visitor experiences, taking advantage of newer devices and cutting-edge features, potential for improved accessibility, reduced device management, and easy information access. Difficulties include digital inequality and exclusion, reduced social interaction, device compatibility, barriers to getting started, dependence on connectivity, privacy concerns, battery and mobile data usage, complex technical support, and distraction from exhibits.`,

E(1,`L10`,`13–17`,`Four Modes of Visitor Behaviour`,
`Describe the four modes of visitor behaviour identified by Morris, Hargreaves, and McIntyre (2004).`,
`Morris, Hargreaves, and McIntyre (2004) identified patterns in how visitors select and engage with a museum's objects in order to create meaning. Browsers select random objects and then require explanation; they are likely to select visually arresting objects that appeal to their sense of awe and wonder. Followers latch on to the museum's explanatory narrative themes and need points of engagement and connection provided through thematic groupings with narrative structure. Searchers gather information on particular collections or exhibitions and are likely to search by keyword rather than by thematic narrative. Researchers seek detailed information about specific objects, including links to authoritative, scholarly commentary and information on the location of related collections.`,

E(1,`L11`,`26–31`,`Museum without Walls`,
`Explain André Malraux's "museum without walls" (musée imaginaire) and why it is considered the origin of the virtual museum.`,
`André Malraux (1901–1976) said "An art book is a museum without walls" and "The history of art for the last hundred years is the history what can be photographed." Because the 20th-century conception of art is much more inclusive than ever before, it is impossible to fit even a fraction of the works of art into a single museum space; the ideal dialogue of art history must take place within the musée imaginaire — "the imaginary museum" or "the museum without walls." His Museum without Walls (1947) was a montage of photographic representations of works of art, a solution to the geographical scattering of the major artworks through books (and now also through the Internet). It is therefore regarded as the origin of the virtual museum.`,

E(1,`L02`,`19–22`,`Ecomuseum`,
`What is an ecomuseum, and how does it differ from a traditional museum?`,
`The ecomuseum is one of the newest types of museums, a concept developed by Hugues de Varine and George Riviere in 1971. "An Ecomuseum is a dynamic way in which communities preserve, interpret, and manage their heritage for a sustainable development. An Ecomuseum is based on a community agreement" (Trento, 2004). It manages heritage in a sustainable environment and interprets not just an event, a place, or a culture, but an entire community. Whereas the classical museum model puts collections at the centre (Museum = building + collections + experts + techniques), the ecomuseum is aimed at using local heritage to promote local development (Ecomuseum = territory + heritage + memory + population, Rivard).`,

E(1,`L03`,`31`,`Explicit vs. Tacit Knowledge`,
`Distinguish explicit and tacit knowledge in museums (Bearman, 2008).`,
`Explicit knowledge ("embodied information") is recorded in catalogues, labels, and databases; it is transferable between people and institutions, and it is what CMS and digital surrogates capture well. Tacit knowledge ("invisible knowledge") is held in curators' and conservators' experience, built through years of handling objects directly; it is the hardest to digitize and the easiest to lose when staff leave.`,

E(2,`L04`,`86–92`,`Digital Preservation Strategies`,
`Compare the four digital preservation strategies: refreshing, migration, emulation, and encapsulation.`,
`Refreshing is a short-term preservation strategy: copying, i.e., the transfer of data between two types of the same storage medium with no bit changes or alteration of data. Migration transfers the data from an old system environment to a new one (e.g., Windows to GNU/Linux), from one file format to another (e.g., Word to PDF), and from one programming language to another; users can search and use digital resources in a changing technological environment, but there is a risk of losing original data in the migration process and a high cost and continuous effort. Emulation is the creation of new software that can copy the operations of older software and hardware to ensure its originality in terms of physical presence, content and functionality; it preserves and uses the original bits, retains "look-and-feel," reduces the need for regular object transformations, and needs less understanding of formats. Encapsulation encapsulates the digital object with all of the information needed to decode and understand it, producing self-describing objects; it is not specific to any particular preservation strategy.`,

E(2,`L04`,`34–45`,`Separation of Content from Presentation`,
`Explain the "separation of content from presentation" in exhibits and its benefits, and distinguish DAM from CMS.`,
`An exhibit has two pieces of data: each digital asset (the media — image, video, piece of text, audio file), stored in its standards-compliant format at as high a quality as possible, and the presentation (the data that describes the media's appearance) related to the specific installation, which is also stored. They are brought together at the installation. This enables museums to add content without post-production for the presentation, delete content without redesigning the presentation, change the interface design without reproducing all the content, and reuse content from one installation in other installations. DAM (Digital Asset Management) is a system that organizes and manages all digital content (images, videos, text, 3D objects), while a CMS (Content Management System) manages content typically at the presentation layer of a digital endpoint such as a website.`,

E(2,`L02`,`5–16`,`Museum Revolutions and New Museology`,
`Explain the First and Second Museum Revolutions (van Mensch) and how New Museology emerged.`,
`Peter van Mensch (1992) described two museum revolutions. The First Museum Revolution was the professionalization of the late 19th century: first national professional organisations (Museums Association, 1889), first professional journals (1878, Germany) and the first code of ethics (1918), first professional training programs (École du Louvre, 1882) and institutionalized conservation science (Rathgen Forschungslabor, 1888); the term "Museology" was introduced. The Second Museum Revolution in the 1960s and 1970s, amid social unrest, political activism, environmentalism and postmodernism, brought self-reflection on elitism and a re-evaluation of what museums are actually for — "For what does a museum exist?" Old museology was criticized as too focused on methods and too little on purpose. New Museology emerged with the Santiago Round Table (ICOM and UNESCO, 1972), which introduced "community museology" — museums developed for and with the people, linked to a local development agenda. André Desvallées coined "Nouvelle Muséologie" (1980), and MINOM was established in 1985. Museums shifted from "being about something" to "being for somebody" (Weil).`,

E(2,`L06`,`40–58`,`3D Scanning Technologies`,
`Compare triangulation, time-of-flight, and phase-shift laser scanning, and explain where photogrammetry fits in the scanner taxonomy.`,
`Scanners are divided into contact types (CMM, ARM mounted — highly accurate but slow, probing the object by physical touch) and non-contact types. Non-contact active scanners include triangulation and distance-measure types. Triangulation scanners are short-range: they shine a laser pattern onto the subject and exploit a camera to look for the location of the laser's projection on the object. Time-of-flight and phase-shift scanners are long-range distance-measure scanners: time-of-flight measures the time difference between emission and reception of a laser pulse, with D = c·t/2; phase-shift measures the phase shift Δφ of a modulated laser, with D = c·Δφ/(4π·f_mod). Photogrammetry is a non-contact passive technique ("photomeasurement") that reconstructs 3D from photographs, e.g., through Structure from Motion and bundle adjustment.`,

E(2,`L02`,`31–43`,`History of Museum Computerization`,
`Summarize the history of museum computerization from the 1960s to the 2000s.`,
`1960s: first attempts at computerization, with the prevailing view that only museums with large collections could justify computers; focus was more on systems than on the information itself. First DBMS appeared: SELGEM (Smithsonian, 1970) and GRIPHOS (adapted from UN library systems, 1968). The Museum Computer Network (MCN) was formed as a clearinghouse. 1970s: REGIS (Arizona State Museum, 1975); minicomputers brought electronic information management within reach of mid-sized museums; cataloguing still handled mainly by curatorial staff. 1980s: toward digitization — registrars developed standard terminology and, with developers, the first generation of Collections Management Systems; no off-the-shelf software, so institutions built their own (DARIS, DAMIS). 1990s: ICT entered the workplace (email the most notable arrival); digital imaging put images into CMS; databases shifted into resources for multimedia; museums went online (museum-l 1991, MCN gopher 1994). 2000s: from inventory to information access — a shift toward active information management and access and shared standards.`,

E(2,`L04`,`23–32`,`Metadata Standards`,
`Compare Dublin Core and CIDOC-CRM, and explain the two levels of homogenizing metadata.`,
`Dublin Core is a general-purpose standard aimed at describing information resources in all domains. It defines 15 main properties (Title, Creator, Subject, Description, Publisher, Contributor, Date, Type, Format, Identifier, Source, Language, Relation, Coverage, Rights), is extendible for a specific domain, and is maintained by the Dublin Core Metadata Initiative; it is flat and attribute-based, listing what an item is about. CIDOC-CRM is a domain-specific standard for cultural heritage (ISO 21127) that models information around events rather than a flat list of attributes — an event-based ontology that builds a relational network of what happened (e.g., a Production Event links a vase, its maker, period, place, and technique as roles). Homogenizing metadata means mapping it to a common model for exchange between systems, on the schema level (metadata based on different schemas such as DCAT, schema.org, CERIF) and on the data (value) level (properties from different controlled vocabularies or syntaxes, e.g., ISO8601 vs. W3C DTF dates).`,

E(2,`HCI`,`2–7`,`Understanding the Museum Context (HCI)`,
`How does HCI in the museum context differ from general HCI? Describe the visitor, experience, activity, and social contexts.`,
`In the museum context, the main goal is not only to successfully accomplish a given task but also to enhance the experience of visitors. HCI research for museum content should not be limited to direct interaction issues between user and system; it should be considered in the large to include broader context — personal, physical, and social — to design information, interface, UX, experience and storytelling. Visitors seek different types of experience (explorers, facilitators, experience-seekers, professionals and hobbyists, rechargers), are not captive learners, and call for personalization. Experience: types of satisfying experiences — object, cognitive, introspective, social. Activity context: immediate apprehendability (intuitivity), high value to get the visitor's attention, and high competition with other exhibits (why lab-based tests fail). Social context: design for groups, pairs, and families; the presence of other visitors observing others use; visitors leaving the exhibit in the mid-stage.`,

E(2,`L10`,`45–61`,`Location-aware Technologies`,
`Compare at least four location-aware technologies used in museums (e.g., WLAN, infrared, Bluetooth, RFID, NFC, beacon) in terms of range and line-of-sight.`,
`WLAN software-based positioning uses a tour server, access points, mobile computers and Ethernet cabling; a radio map of signal strength is related to an architectural map so the server can triangulate each visitor's location, usually combined with IR, Bluetooth or radio triggers for finer positioning. Infrared (IR) triggers in ceilings or over doors play content as visitors pass by; IR is a line-of-sight technology and proximity to natural light can degrade the beam. Bluetooth tags work like IR tags but have a larger range (up to 10m/30ft) and do not require line-of-sight; they are radio-based, simpler and more accurate than WLAN, and powerful for visually-impaired visitors. RFID uses radio waves to identify objects automatically; range is usually no more than a few feet (low-powered 5–25cm) and does not require line-of-sight. NFC uses magnetic field induction at a distance of 4 inch or less. Beacons are small wireless sensors that continuously advertise their location using a Bluetooth low energy radio transmitter. GPS triggering is for outdoors.`,
[[`WLAN: radio map + server triangulation`,[`wlan`,`wireless lan`,`radio map`,`signal strength`,`access point`],[`와이파이`,`무선랜`,`신호 강도`]],

E(2,`L11`,`62–80`,`Europeana`,
`What is Europeana? Explain its scope, its metadata models (ESE and EDM), and the role of aggregators.`,
`Europeana is an innovative web portal that opens a doorway to the digital resources of Europe's museums, libraries, archives and audiovisual collections (over 50 million records from over 3,500 institutions as of Nov 2018). It is not just a web portal but a services platform providing an API so that cultural institutions and users can access content, provide content, and build applications; by the DELOS classification it is a Digital Library System. Its content is cross-domain, so metadata is mapped to a single data model: Europeana's Semantic Elements (ESE), a Dublin Core-based set of fields with 12 additional Europeana elements, and the Europeana Data Model (EDM), a richer model gradually replacing ESE that is backwardly compatible with ESE. Europeana holds only metadata and thumbnails, not the original digital item. Aggregators (domain, national, regional, thematic) disseminate Europeana's vision, provide feedback, promote and implement standards, and provide domain-specific expertise.`,

E(2,`L03`,`32–37`,`Threefold Store of Information and Knowledge`,
`Describe the "Threefold Store of Information and Knowledge" in a museum.`,
`A museum holds a threefold store of information and knowledge. The first is the immediately visible store — the collections and what visitors can see directly. The second is a store of "embodied" information within the objects themselves: what artefacts are made of, who made them, how, where and for what purpose they were made; where natural objects originate from, how and when they were formed, the material of which they are composed, how once-living organisms functioned, and where and when they lived. The third is an invisible store of knowledge in the minds of the people who are responsible for the care and presentation of the collections, made visible in the form of products that help visitors to relate to what they see before them.`,

E(2,`L10`,`18–19`,`Requirements for Mobile Technology Design`,
`List and explain at least five requirements for the design of mobile technology for museum learning, with their sources.`,
`Technology should be easy to use and unobtrusive; it should enable the experience rather than detract from it (Hawkey 2004). Content should work with the objects, to direct the visitor's attention and require their feedback (Fisher 2005). Visitors should be offered choice wherever possible (Falk and Dierking 2000). Visually arresting objects should be incorporated to help Browsers transition to Followers (Morris, Hargreaves, and McIntyre 2004). A strong narrative should be provided to help structure the content. Multimedia should be incorporated where possible and appropriate (Mayer 2001; Morris et al. 2004), and audio and video must be coherent (Proctor and Tellis 2003). Specialist language should be avoided; unfamiliar terms need to be explained (Fisher 2005). Engagement with objects should be promoted through personal challenge (i.e., quizzes) and play (Fisher 2005).`,

E(3,`L02`,`28–30`,`Redefinition of ICOM`,
`Compare the ICOM 2007 and 2022 museum definitions and explain why the 2019 Kyoto proposal failed. What underlying question does this debate raise?`,
`The 2007 Vienna definition is a function-listing definition: "a non-profit, permanent institution in the service of society and its development, open to the public, which acquires, conserves, researches, communicates and exhibits the tangible and intangible heritage of humanity and its environment for the purposes of education, study and enjoyment." The 2019 Kyoto proposal redefined museums as agents that actively pursue social values (democratization, inclusion, justice, equality), putting social mission at center stage; amid an "ideological manifesto" dispute, 70.4% voted to postpone. Kyoto's failure stemmed from (1) the challenge of striking a balance between ideological expression and descriptions of traditional functions, (2) a lack of democratic procedures — a text distributed six weeks before the vote vs. an 18-month participatory process across 126 countries for 2022, and (3) fundamental differences among regional museums. The 2022 Prague definition (92.4% in favor) says a museum is "a not-for-profit, permanent institution in the service of society that researches, collects, conserves, interprets and exhibits tangible and intangible heritage. Open to the public, accessible and inclusive, museums foster diversity and sustainability. They operate and communicate ethically, professionally and with the participation of communities, offering varied experiences for education, enjoyment, reflection and knowledge sharing" — adding inclusion and sustainability. The underlying question: "Should museums be academic and neutral institutions, or should they be agents of social change?"`,

E(3,`L04`,`96–106`,`OAIS Functional Model`,
`Explain the OAIS reference model: its definition, information packages, and the six functional entities, describing how information flows from Producer to Consumer.`,
`The Reference Model for an Open Archival Information System (OAIS), adopted as ISO 14721:2003, is a framework for understanding the archival concepts needed for long-term preservation (access), with primary focus on digital information. An OAIS is "an archive, consisting of an organization of people and systems, that has accepted the responsibility to preserve information and make it available for a Designated Community." An Information Package is the conceptual linking of Content Information, Preservation Description Information (metadata about Provenance, Context, Reference, Fixity) and Packaging Information; there are Submission (SIP), Archival (AIP) and Dissemination (DIP) Information Packages. The Producer submits a SIP; Ingest accepts SIPs and prepares AIPs for storage; Archival Storage stores and retrieves AIPs; Data Management populates, maintains and accesses descriptive information; Access makes holdings visible to Consumers, who receive DIPs; Preservation Planning monitors the OAIS environment to ensure content remains accessible to the Designated Community; and Administration controls the day-to-day operation of the other entities.`,

E(3,`HCI`,`22–47`,`Designing an Immersive, Contextually Embedded Interactive`,
`You are designing an interactive installation for a prehistoric gallery. Using concepts from the HCI lecture (activity context, immersion process, ArtLens Wall factors, contextually embedded design), explain how you would design it and why.`,
`Because visitors are not a captive audience and many value-providing objects compete for their attention, the installation needs "immediate apprehendability" (Allen, 2004): if interaction is difficult or gives no immediate reward, most visitors quickly give up and leave. Long interaction sequences should be avoided, since visitors are likely to wander off mid-stage, and the design should support groups and visitors who join mid-way. Following the immersion process, the design moves visitors from Engagement (aesthetic visual/auditory stimuli, intuitiveness, predictability, transparency/low technology barrier) to Engrossment (intuitive UI/UX, useful and rich information, difficulty balancing, context-based design) to Transcending involvement (immersion), with HCI in the design process throughout. Lessons from the ArtLens Wall — visual effect as a predictor for involvement, curation (thematic grouping), personal experience, and personalization — can be applied. Finally, it should be "contextually embedded" (Hornecker, 2016): highly integrated with the museum environment and surrounding artefacts so visitors draw connections between digital content and the real exhibits, avoiding Pujol-Tost's (2011) warning that interactives fail when they lack an effective spatial and conceptual relationship with the artefacts. Because lab-based tests cannot predict behaviour amid competition, it should be tested in situ.`,

E(3,`L04`,`69–92`,`Digital Dark Age and Preservation`,
`What is the "Digital Dark Age"? Using the Viking case, the lifespan of media, and the UNESCO Charter, argue why digital preservation is needed and which strategies address it.`,
`The Dark Age refers to the Middle Ages, whose "darkness" was a lack of records compared with earlier and later periods of "light." The Digital Dark Age is a lack of historical information in the digital age (an early mention at IFLA in 1997): outdated file formats, software, or hardware become corrupt, scarce, or inaccessible as technologies evolve and data decay. The two Viking space probes (1975) generated data from an unrepeatable $1 billion mission, yet the magnetic tapes were corrupted/unidentifiable after two decades despite a climate-controlled environment, and scientists could not decode the formats. Addison's lifespan of media shows stone 1000x, paper/wood 100x, magnetic/optical 10x, and coding 1x. Media issues include differences in quality or storage conditions, relatively short lifetimes, format differences, hardware & software dependence, and scale (an increasing flood of data). The UNESCO Charter on the Preservation of Digital Heritage (17 Oct 2003) responds to memory institutions' concern that digital materials will become inaccessible unless widespread measures are taken; Article 2 states the purpose is to ensure it remains accessible to the public, and Article 5 says continuity is fundamental, with measures throughout the life cycle. Strategies are refreshing, migration, emulation and encapsulation, supported by frameworks such as OAIS and digital curation.`,
[[`Digital Dark Age = lack of historical information in digital age`,[`digital dark age`,`lack of historical`,`lack of records`],[`디지털 암흑`,`기록 부족`,`정보 부족`]],

E(3,`L06`,`5–11`,`Information-Theoretic Basis of Digitization`,
`A museum is planning to digitize a fragile manuscript with fine cracks. Using the Nyquist–Shannon theorem, quantization error/SQNR, and ADC bit depth, justify how capture resolution and bit depth should be chosen for the preservation master.`,
`Digitization is sampling plus quantization. By the Nyquist–Shannon sampling theorem, to reconstruct a continuous signal without loss the sampling frequency must be at least twice the highest frequency component (f_s ≥ 2·f_max). In an image, the "highest frequency component" corresponds to the smallest identifiable detail of the original — such as a crack or woven thread — so capture resolution should be derived from the physical detail size of the object, not chosen arbitrarily: at least two samples across the smallest crack. For quantization, an n-bit ADC divides the full-scale voltage into 2ⁿ equal levels (LSB = V_FS/2ⁿ); the larger n, the finer the variation it can resolve. SQNR(dB) ≈ 6.02n + 1.76, so an 8-bit channel gives ≈ 50 dB and a 16-bit channel ≈ 98 dB. Because quantization is an inherently irreversible loss of information, preservation masters are captured at 16-bit per channel rather than 8-bit, giving a safety margin for later correction and restoration. Capturing once at high quality also reduces handling of fragile originals.`,
[[`Digitization = sampling + quantization`,[`sampling`,`quantiz`],[`샘플링`,`양자화`]],
 [`Nyquist: f_s ≥ 2·f_max`,[`nyquist`,`twice`,`2f`,`2·f`,`2 times`,`highest frequency`],[`나이퀴스트`,`두 배`,`2배`]],
 [`Highest frequency = smallest detail (crack); derive resolution from physical detail size`,[`smallest`,`detail`,`crack`,`physical`],[`가장 작은`,`디테일`,`균열`,`세부`]],
 [`ADC: 2ⁿ levels, LSB = V_FS/2ⁿ`,[`2^n`,`2ⁿ`,`levels`,`lsb`,`adc`],[`레벨`,`단계`]],
 [`SQNR ≈ 6.02n + 1.76 (8-bit ≈ 50dB, 16-bit ≈ 98dB)`,[`sqnr`,`6.02`,`98`,`50db`,`50 db`],[`신호 대 양자화`]],
 [`Quantization is irreversible → 16-bit masters as safety margin`,[`irreversible`,`16-bit`,`16 bit`,`safety margin`,`margin`],[`비가역`,`되돌릴 수 없`,`16비트`,`여유`]]],
[[`L06`,11,`To reconstruct a continuous signal without loss, the sampling frequency must be at least twice the highest frequency component of the signal … capture resolution should be derived from the physical detail size of the object, not chosen arbitrarily … Quantization is an inherently irreversible loss of information, so extra bit depth provides a safety margin for later correction and restoration.`],[`L06`,5,`An n-bit ADC divides the full-scale voltage into 2ⁿ equal levels — the larger n is, the finer the signal variation it can resolve`]]);

E(3,`L10`,`11–19`,`Mobile Guide Design for Museum Learning`,
`Design a mobile guide for a history museum that supports all four visitor modes. Ground your design in free-choice learning, the three contexts it facilitates, and the lecture's design requirements.`,
`Museum learning is free-choice learning (Falk and Dierking, 2000): it "tends to be nonlinear, is personally motivated, and involves considerable choice on the part of the learner as to what to learn, as well as where and when to participate in learning," with the ultimate goal of creating new knowledge and personal meaning (Hawkey 2004). Mobile technology is personal, portable and networked, and facilitates the personal context (guidance based on the learner's interests and needs), the physical context (location-based information) and the sociocultural context. For Browsers, who select random visually arresting objects, the guide highlights such objects, which helps Browsers transition to Followers. For Followers, it offers thematic tours with a strong narrative structure. For Searchers, it provides keyword search over collections. For Researchers, it links to detailed, authoritative scholarly commentary and the location of related collections. Following the requirements, the technology must be easy to use and unobtrusive (Hawkey), content should work with the objects (Fisher), choice should be offered (Falk and Dierking), multimedia should be coherent (Proctor and Tellis), specialist language avoided (Fisher), and engagement promoted through quizzes and play (Fisher).`,

E(3,`L06`,`83–94`,`Open Data Policies`,
`Compare the open access policies of the Rijksmuseum, the Smithsonian, and the British Museum, and relate them to the FAIR principles. What is the key lesson of the comparison?`,
`The Rijksmuseum intended to digitize all one million objects by 2020 and makes high-resolution images freely downloadable under Creative Commons "0" (CC0) — a very progressive approach to copyright — and Rijksstudio actively encourages users to remix images into personal creations. The Smithsonian has applied CC0 since its 2020 Open Access declaration, releasing 2.8M+ 2D/3D assets and providing its own 3D viewer. The British Museum requires a paid license for most images for commercial use and released only a portion of 3D models via Sketchfab — a useful policy contrast. Google Arts & Culture varies by partner institution and invests in proprietary technology such as the gigapixel Art Camera. The FAIR principles (UNESCO Recommendation on Open Science) require data to be Findable, Accessible without technical or legal barriers, Interoperable, and Reusable; CC0 policies most fully satisfy accessibility and reusability. The key lesson: digitization technology may be similar across institutions, but how the output is released and licensed is a policy choice.`,
[[`Rijksmuseum: CC0, free high-res downloads, Rijksstudio remix`,[`rijks`,`cc0`,`creative commons`,`remix`],[`라익스`,`레이크스`,`리크스`]],

E(3,`L11`,`3–15`,`Defining the Virtual Museum`,
`Compare the Wikipedia, Encyclopaedia Britannica, and V-MusT (2014) definitions of the virtual museum, and discuss whether a virtual museum can be a "museum" under ICOM's criteria.`,
`The definition of a virtual museum is not fixed; there are many definitions depending on the contemporary status of ICT since the 1990s. Wikipedia: "a museum that exists only online," also called an online museum, electronic museum, hypermuseum, digital museum, cybermuseum or Web museum; it can be designed around specific objects or new exhibitions, refer to Web offerings of traditional museums, or be born-digital content. This definition emphasizes the characteristic "online." Britannica: "a collection of digitally recorded images, sound files, text documents, and other data of historical, scientific, or cultural interest that are accessed through electronic media"; it "does not house actual objects and therefore lacks the permanence and unique qualities of a museum in the institutional definition," and most are sponsored by and dependent on institutional museums — yet hyperlinking and multimedia let representations from multiple sources be brought together, a powerful tool for comparative study. V-MusT (2014): "a digital entity that draws on the characteristics of a museum, in order to complement, enhance, or augment the museum experience through personalization, interactivity, and richness of content," which can be the digital footprint of a physical museum or act independently while maintaining the authoritative status bestowed by ICOM. Against ICOM's five points — institution behind the museum, tangible and intangible heritage, a communication system linking objects, openness to the public, and goals of education, study and enjoyment — a virtual museum can qualify, especially as the introduction of "intangibility" (cultural centres facilitating intangible heritage, living heritage and digital creative activity) has broadened the object-driven museum.`,

E(3,`HCI`,`41`,`Critique of High-tech Interactives`,
`A museum director wants to install many large touchscreens to "look modern." Critically evaluate this plan using the HCI lecture's reasons and considerations for interactive installations.`,
`A major reason for introducing novel interactive installations into museums is the assumption that they can attract new (often younger) audiences, as well as the desire to project an innovative, modern image. However, there are considerations: economic considerations; rapid obsolescence of technology; concerns that screens and high-tech installations may distract from the actual artefacts; "political" and organisational issues; and demands in terms of curation, conservation and archival work. Interactive exhibits often fail because they lack an effective spatial and conceptual relationship with the exhibited artefacts, distracting or isolating visitors from the context (Pujol-Tost, 2011); instead they should be contextually embedded (Hornecker, 2016). Screens also face high competition for attention and need immediate apprehendability and immediate rewards. Lab-based tests cannot predict whether visitors will approach and persist in a real gallery, so the plan should be evaluated in context. A better plan would integrate fewer, well-designed interactives linked to objects.`,
[[`Reason: attract new/younger audiences, modern image`,[`younger`,`new audience`,`modern image`,`innovative`],[`젊은`,`새로운 관객`,`현대적`,`혁신`]],

 [`Political/organisational issues; curation/conservation/archival demands`,[`political`,`organisational`,`organizational`,`archival`,`curation`],[`정치`,`조직`,`아카이브`,`큐레이션`]],
 [`Contextually embedded instead of isolated (Pujol-Tost / Hornecker)`,[`contextually embedded`,`pujol`,`hornecker`,`spatial and conceptual`],[`맥락`,`통합`,`공간적`]],

[[`HCI`,41,`A major reason for introducing novel interactive installations into museums • the assumption that this can attract new (often younger) audiences, as well as the desire to project an innovative, modern image of itself | Considerations • Economic considerations • Rapid obsolescence of technology • Concerns that screens and high-tech installations may distract from the actual artefacts • "Political" and organisational issues • Demands in terms of curation, conservation and archival work`],[`HCI`,42,`Interactive exhibits often fail their purpose because they lack an effective spatial and conceptual relationship with the exhibited artefacts distracting or isolating from the context Pujol-Tost, 2011`]]);

E(3,`L03`,`31–75`,`Opening the CMS: Powerhouse OPAC2.0`,
`Analyse the Powerhouse Museum's OPAC2.0 (2006) case using the concepts of the "invisible store of knowledge," explicit/tacit knowledge, and the shift from "being about something" to "being for somebody."`,
`In 2006 the Powerhouse Museum in Sydney, led by Seb Chan, automatically pushed 62,000+ object records (70%+ of the collection) from its CMS (EMu) into a public catalogue. There were 239,001 visitors and 1.2 million object views in the first six weeks, and 95% of published objects were viewed at least once in the first month. A folksonomy let visitors tag objects themselves, and user corrections to old records tripled, extending the registrar/curator's explicit record with public input. The lecture interprets the 95% figure as the "invisible store of knowledge" made visible at scale: most of a collection is normally seen only by staff, and opening the CMS reversed that almost overnight. In terms of the threefold store and explicit vs. tacit knowledge, CMS records capture explicit knowledge well, while public tagging adds new knowledge. The case also illustrates the transition from "being about something" (the care and study of collections) to "being for somebody" (the delivery of a public service), and the shift in information-based technologies from tools for automation to knowledge enablers — although museum collections data was designed primarily for internal use and was not a ready fit for the Web.`,

E(3,`L09`,`8–46`,`Technology Horizons 2012–2016`,
`Using the NMC Horizon Reports (Museum Editions) presented in the lecture, describe how predicted technologies shifted between 2012 and 2016, and explain one near-term and one far-term technology of 2016 with examples.`,
`The NMC Horizon Project explored trends, challenges and technology developments on three horizons: near-term (<1 year), mid-term (2–3 years), far-term (4–5 years). In 2012, Mobile Apps and Social Media were near-term, Augmented Reality and Open Content mid-term, and the Internet of Things and Natural User Interfaces far-term. In 2013, BYOD and Crowdsourcing were near-term, Electronic Publishing and Location-Based Services mid-term, and Natural User Interfaces and Preservation and Conservation Technologies far-term. In 2015, BYOD and Games and Gamification were near-term, Location-Based Services and Makerspaces mid-term, and Natural User Interface and the Internet of Things far-term. In 2016, Digital Humanities Technologies and Makerspaces were near-term, Location Intelligence and Virtual Reality mid-term, and Information Visualization and Networked Objects far-term. Thus Location-Based Services evolved into Location Intelligence, Makerspaces moved from mid-term to near-term, and IoT reappeared as Networked Objects ("phygital"). Makerspaces (near-term 2016) are part of a growing movement of immersive, hands-on spaces where people of all ages can participate in creative, innovative design experiences, with museums as leaders in participatory learning. Networked Objects (far-term) use embedded chips, sensors or tiny processors, with potential for improving conservation, increasing access to contextual knowledge, and reinventing interaction with cultural works.`,

E(3,`L07`,`22–67`,`3D Technologies Across the Museum`,
`Discuss how 3D technologies serve documentation, conservation/restoration, exhibition, and accessibility in museums, citing at least four cases from the lecture.`,
`For documentation, museums integrate multiple techniques: multi-resolution modelling combines laser scanning and close-range photogrammetry (Roman Forum, Pompeii, 2007; Bamburgh Castle); CT scanning reveals interiors (Embrue Orchid, Smithsonian X 3D; the funerary urn of Saint-Pair-sur-Mer analysed by tomodensitometry — slice views and density information), and integration such as laser scanning + CT, laser scanning + UV (Digital Michelangelo Project, mapping multiple UV images onto the 3D model), or laser + thermal imaging adds information. Mass 3D digitization (Cultlab3D by Fraunhofer IGD) tackles large collections. For conservation/restoration, the Madonna of Pietranico used 3D technologies to assist the restoration of a fragmented terracotta statue through virtual reassembly and support extraction, and Palmyra busts destroyed by ISIS were restored. For exhibition, VR (Sukkuram HMD Travel with Oculus HMD + Leap Motion) and AR (CHESS project at the Acropolis Museum combining AR with socio-personal interaction and storytelling; Jura Scope at the Natural History Museum Berlin) create new experiences. For accessibility, 3D printing enables "Please touch" — replicas for the blind — and reproductions such as the Egyptian Museum Berlin's Head of Queen Tiy.`,

/* ======================= STORAGE ======================= */
const SKEY = 'gct583-exam-v1';
let S = {seen:{1:[],2:[],3:[]}, wrong:{}, sets:0, history:[], current:null};
function lsLoad(){ try{ const t=localStorage.getItem(SKEY); if(t){ const o=JSON.parse(t); S=Object.assign(S,o);} }catch(e){} }
let dbRef=null, saveTimer=null, saving=false, dirty=false;
function save(){
  try{ localStorage.setItem(SKEY, JSON.stringify(S)); }catch(e){}
  dirty=true; clearTimeout(saveTimer); saveTimer=setTimeout(flush,1200);
}
async function flush(){
  if(!dbRef||saving||!dirty) return;
  saving=true; dirty=false;
  try{ await dbRef.set({state:JSON.stringify(S), at:Date.now()}); }catch(e){}
  saving=false; if(dirty) flush();
}
async function initDb(){
  try{
    if(!window.claude||!claude.use) return;
    const [db,user] = await Promise.all([claude.use('db'),claude.use('user')]);
    if(!db||!user) return;
    const uid = await user.id(); if(!uid) return;
    const ref = db.doc(`data/users/${uid}/state`);
    const snap = await ref.get();
    if(snap.exists){
      const d = snap.data(); const remote = d && d.state ? JSON.parse(d.state) : null;
      if(remote){
        // merge: union wrong notes and seen; prefer the richer side
        const loc = S;
        const merged = Object.assign({}, remote);
        merged.wrong = Object.assign({}, remote.wrong||{}, loc.wrong||{});
        if(loc._deleted) loc._deleted.forEach(id=>delete merged.wrong[id]);
        merged.seen = {}; [1,2,3].forEach(l=>merged.seen[l]=[...new Set([...(remote.seen?.[l]||[]),...(loc.seen?.[l]||[])])]);
        merged.sets = Math.max(remote.sets||0, loc.sets||0);
        merged.history = (remote.history||[]).length>=(loc.history||[]).length?remote.history:loc.history;
        merged.current = loc.current || remote.current || null;
        S = merged;
      }
    }
    dbRef = ref; S._deleted=[]; save(); render();
  }catch(e){}
}

/* ======================= SET BUILDING ======================= */
function pickStratified(pool, n){
  const by = {}; shuffle(pool).forEach(x=>{(by[x.lec]=by[x.lec]||[]).push(x);});
  const keys = shuffle(Object.keys(by)); const out=[];
  while(out.length<n && keys.some(k=>by[k].length)){
    for(const k of keys){ if(out.length>=n) break; if(by[k].length) out.push(by[k].shift()); }
  }
  return out;
}
function buildSet(lv){
  const seen = new Set(S.seen[lv]||[]);
  const allM = MCQ.filter(x=>x.lv===lv), allE = ESSAY.filter(x=>x.lv===lv);
  let m = pickStratified(allM.filter(x=>!seen.has(x.id)), 20);
  let resetM=false, resetE=false;
  if(m.length<20){ resetM=true; const have=new Set(m.map(x=>x.id)); m = m.concat(pickStratified(allM.filter(x=>!have.has(x.id)), 20-m.length)); }
  let e = pickStratified(allE.filter(x=>!seen.has(x.id)), 5);
  if(e.length<5){ resetE=true; const have=new Set(e.map(x=>x.id)); e = e.concat(pickStratified(allE.filter(x=>!have.has(x.id)), 5-e.length)); }
  // update seen: on reset, start a fresh cycle with only the items now drawn from the old cycle
  let ns = S.seen[lv]||[];
  if(resetM) ns = ns.filter(id=>!id.startsWith('m'));
  if(resetE) ns = ns.filter(id=>!id.startsWith('e'));
  S.seen[lv] = [...new Set([...ns, ...m.map(x=>x.id), ...e.map(x=>x.id)])];
  S.sets = (S.sets||0)+1;
  const items = [...m.map(x=>({id:x.id, order:shuffle([0,1,2,3])})), ...e.map(x=>({id:x.id}))];
  return {mode:'exam', lv, no:S.sets, date:new Date().toISOString().slice(0,10), items, ans:{}};
}
function unseenCount(lv){
  const seen = new Set(S.seen[lv]||[]);
  return {m:MCQ.filter(x=>x.lv===lv&&!seen.has(x.id)).length, e:ESSAY.filter(x=>x.lv===lv&&!seen.has(x.id)).length,
          tm:MCQ.filter(x=>x.lv===lv).length, te:ESSAY.filter(x=>x.lv===lv).length};
}

/* ======================= ESSAY GRADING ======================= */
function termRegex(term){
  const t = term.trim(); if(!t) return null;
  const e = t.replace(/[.*+?^${}()|[\]\\]/g,'\\$&');
  const ascii = /^[\x00-\x7F]+$/.test(t);
  if(ascii && t.length<=3) return new RegExp(`(^|[^a-z0-9])(${e})(?![a-z0-9])`,'gi');
  return new RegExp(`()(${e})`,'gi');
}
function findAll(text, term){
  const re = termRegex(term); if(!re) return [];
  const ascii=/^[\x00-\x7F]+$/.test(term.trim());
  const out=[]; let m; while((m=re.exec(text))){ const s=m.index+m[1].length; let e=s+m[2].length; if(ascii&&/[a-z]$/i.test(m[2])) while(e<text.length&&/[a-z]/i.test(text[e])) e++; out.push([s,e]); if(m[0].length===0) re.lastIndex++; }
  return out;
}
function gradeEssay(q, text){
  const res = q.keys.map(k=>{
    const terms=[...k.en,...k.ko]; let spans=[];
    terms.forEach(t=>spans=spans.concat(findAll(text,t)));
    return {t:k.t, hit:spans.length>0, spans, terms};
  });
  const hit = res.filter(r=>r.hit).length;
  return {res, score: Math.round(hit/q.keys.length*100)};
}
function markSpans(text, spans, cls){
  spans = spans.slice().sort((a,b)=>a[0]-b[0]); const merged=[];
  for(const s of spans){ const l=merged[merged.length-1]; if(l&&s[0]<=l[1]) {l[1]=Math.max(l[1],s[1]); if(s[2]&&!l[2]) l[2]=s[2];} else merged.push(s.slice()); }
  let out='', i=0;
  for(const [a,b,c] of merged){ out+=esc(text.slice(i,a))+`<mark class="${c||cls}">${esc(text.slice(a,b))}</mark>`; i=b; }
  return out+esc(text.slice(i));
}
function modelHTML(q, res){
  const text=q.model, spans=[];
  res.forEach(r=>{
    // first occurrence of any English term of this key in the model answer
    let best=null;
    r.terms.forEach(t=>{ const f=findAll(text,t)[0]; if(f&&(!best||f[0]<best[0])) best=f; });
    if(best) spans.push([best[0],best[1], r.hit?'k-hit':'k-miss']);
  });
  spans.sort((a,b)=>a[0]-b[0]); let out='',i=0;
  for(const [a,b,c] of spans){ if(a<i) continue; out+=esc(text.slice(i,a))+`<span class="${c}">${esc(text.slice(a,b))}</span>`; i=b; }
  return out+esc(text.slice(i));
}

      ${a.ai&&a.ai.errors&&a.ai.errors.length?`<div><div class="glabel">틀리거나 부정확한 부분</div><ul class="errs">${a.ai.errors.map(e=>`<li><q>${esc(e.quote)}</q> — ${esc(e.issue)}${e.fix?`<br><span class="muted">고친 표현: ${esc(e.fix)}</span>`:''}</li>`).join('')}</ul></div>`:''}
      ${a.ai&&a.ai.summary?`<div><div class="glabel">AI 총평</div><div class="ai-out">${esc(a.ai.summary)}</div></div>`:''}
      <div><div class="glabel">모범 답안</div><div class="model">${modelHTML(q,g.res)}</div>
        <div class="legend" style="margin-top:6px"><span class="l3">내가 쓴 핵심 개념</span><span class="l2">내가 빠뜨린 핵심 개념</span></div></div>
      <div><div class="glabel">강의자료 원문</div>${q.quotes.map(x=>srcHTML(x[0],x[1],x[2])).join('')}</div>
      <div class="row" data-ai-row></div>
    </div>`;
  const row=box.querySelector('[data-ai-row]');
  aiButton(set,q,a,row);
  if(set.mode==='retry' && ok && S.wrong[q.id]){
    const b=document.createElement('button'); b.className='btn sm ghost'; b.textContent='이제 알아요 · 오답노트에서 지우기';

    row.appendChild(b);
  }
  return box;
}

Return JSON only, with this shape:

 "errors":[{"quote":"an EXACT substring copied from the student answer that is factually wrong or imprecise","issue":"한국어로 왜 틀렸는지","fix":"the correct wording, using the lecture's exact English terms"}],
 "summary":"한국어 2-3문장 총평: 가장 중요한 누락과 시험에서 써야 할 정확한 강의 용어"}
Use an empty "errors" array if nothing is wrong. Do not invent errors.`;
      try{

function setStats(set){
  const m=set.items.filter(i=>i.id[0]==='m'), e=set.items.filter(i=>i.id[0]==='e');
  const done=m.filter(i=>set.ans[i.id]!=null).length, right=m.filter(i=>set.ans[i.id]===0).length;
  const eg=e.filter(i=>set.ans[i.id]&&set.ans[i.id].graded);
  const eavg=eg.length?Math.round(eg.reduce((s,i)=>s+set.ans[i.id].score,0)/eg.length):0;
  return {mt:m.length,done,right,et:e.length,eg:eg.length,eavg,complete:done===m.length&&eg.length===e.length};
}
function renderSummary(set, host){
  const s=setStats(set);
  host.innerHTML = `<div class="summary">
      <div><b>${s.right}/${s.mt}</b><span>객관식 정답 (응답 ${s.done})</span></div>
      <div><b>${s.eg?s.eavg:'–'}</b><span>서술형 평균 (${s.eg}/${s.et} 채점)</span></div>
      <div><b>${Object.keys(S.wrong).length}</b><span>오답노트 누적 문항</span></div>
    </div>

      <button class="btn ghost" data-notes>오답노트 보기</button>
    </div>

  sec.querySelectorAll('[data-f]').forEach(b=>b.onclick=()=>{noteFilter=b.dataset.f; renderNotes();});
  const nl=sec.querySelector('#nlist');
  if(!all.length){ nl.innerHTML=`<div class="empty"><b>오답노트가 비어 있습니다.</b><br>퀴즈에서 틀린 객관식과 60점 미만 서술형이 여기에 자동으로 모입니다.<div class="row" style="justify-content:center;margin-top:12px"><button class="btn" id="gq">퀴즈 풀러 가기</button></div></div>`; $('#gq').onclick=()=>go('quiz'); return; }
  list.forEach(w=>nl.appendChild(noteEl(w)));

  // retry sheet
  const rs=document.createElement('section'); rs.className='sheet';
  if(retrySet){ app.appendChild(paperFor(retrySet,`오답 다시 풀기`,`GCT583 · Retry Wrong Answers`)); }
  else{
    rs.innerHTML=`<div class="part" style="margin-top:0"><h2>오답 퀴즈</h2><span>오답노트 문항만 다시 출제</span></div>
      <p class="lede">현재 필터(${noteFilter==='all'?'전체':esc(noteFilter==='mcq'?'객관식':noteFilter==='essay'?'서술형':noteFilter)})의 ${list.length}문항을 순서와 보기를 섞어 다시 풉니다. 맞히면 그 자리에서 오답노트에서 지울 수 있습니다.</p>
      <div class="row"><button class="btn" id="retry" ${list.length?'':'disabled'}>오답 퀴즈 시작 (${list.length}문항)</button></div>`;
    app.appendChild(rs);
    $('#retry').onclick=()=>{
      const ids=shuffle(list.map(w=>w.id));
      const items=[...ids.filter(i=>i[0]==='m').map(id=>({id,order:shuffle([0,1,2,3])})), ...ids.filter(i=>i[0]==='e').map(id=>({id}))];
      retrySet={mode:'retry',lv:0,no:0,date:new Date().toISOString().slice(0,10),items,ans:{}};
      renderNotes(); setTimeout(()=>{ const s=document.querySelectorAll('.sheet'); s[s.length-1].scrollIntoView({behavior:'smooth'}); },30);
    };
  }
}
function noteEl(w){
  const q=BYID[w.id]; const el=document.createElement('article'); el.className='note';
  const head=`<div class="note-h"><div class="nc"><div class="ntag">${w.type==='mcq'?'객관식':'서술형'} · ${LVN[q.lv]} · ${esc(lecName(q.lec))} · p.${esc(q.p)} · ${w.n}회 틀림</div>
      <h3 class="nconcept">${esc(cname(q.c))}</h3></div><button class="nx" aria-label="오답노트에서 지우기" title="지우기">×</button></div>`;
  let body='';
  if(w.type==='mcq'){
    body=`<div class="note-b">
      <div><span class="ans-ok">정답 · ${esc(q.o[0])}</span></div>
      <div>내 답 · <span class="ans-no">${esc(w.my||'')}</span></div>
      <div class="ex">${esc(q.ex)}</div>
      ${srcHTML(q.lec,q.p,q.qt)}
      <details><summary>문제 지문 보기</summary><p style="margin:6px 0 0">${esc(q.q)}</p>${q.stem?`<img class="stemimg" style="margin-left:0" src="img/${q.stem}.jpg" alt="">`:''}</details>
      ${slideHTML(q.img)}
    </div>`;
  } else {
    body=`<div class="note-b">
      <div><b style="color:var(--red)">빠뜨린 핵심 (${w.score??0}점)</b><ul class="misslist">${(w.miss||[]).map(m=>`<li>${esc(m)}</li>`).join('')}</ul></div>
      <details><summary>모범 답안 보기</summary><div class="model" style="margin-top:6px">${esc(q.model)}</div></details>
      <details><summary>내가 쓴 답안 보기</summary><div class="mine" style="margin-top:6px">${esc(w.my||'')}</div></details>
      ${q.quotes.map(x=>srcHTML(x[0],x[1],x[2])).join('')}
      <details><summary>문제 지문 보기</summary><p style="margin:6px 0 0">${esc(q.q)}</p></details>
    </div>`;
  }
  el.innerHTML=head+body+`<div data-c></div>`;
  el.querySelector('.nx').onclick=()=>{
    const c=el.querySelector('[data-c]');
    c.innerHTML=`<div class="confirm"><span>"${esc(cname(q.c))}" 항목을 오답노트에서 지울까요?</span><button class="btn sm" data-y style="background:var(--red);border-color:var(--red)">지우기</button><button class="btn sm ghost" data-n>취소</button></div>`;
    c.querySelector('[data-n]').onclick=()=>c.innerHTML='';
    c.querySelector('[data-y]').onclick=()=>{ removeWrong(w.id); renderNotes(); };
  };
  return el;
}

/* ======================= MATERIALS VIEW ======================= */
let unlockedKey=null, matMsg='';
const b64 = s => Uint8Array.from(atob(s),c=>c.charCodeAt(0));
async function deriveKey(pw){
  const base=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveKey']);
  return crypto.subtle.deriveKey({name:'PBKDF2',salt:b64(MANIFEST.salt),iterations:MANIFEST.iter,hash:'SHA-256'},base,{name:'AES-GCM',length:256},false,['decrypt']);
}
async function decryptBuf(key,buf){ const u=new Uint8Array(buf); return crypto.subtle.decrypt({name:'AES-GCM',iv:u.slice(0,12)},key,u.slice(12)); }
function fmtMB(n){ return (n/1048576).toFixed(1)+' MB'; }
function renderMaterials(){
  const app=$('#app');
  const entries=Object.entries(LEC).map(([code,l])=>({code,...l,info:MANIFEST.files[l.f]})).filter(e=>e.info);
  app.innerHTML=`<section class="sheet">
    <div class="exam-head"><div class="t"><small>GCT583 · Course Materials</small><h1>강의자료</h1></div>
      <div class="meta"><div>파일</div><div>${entries.length}개 PDF</div><div>보호</div><div>AES-256 암호화</div><div>상태</div><div>${unlockedKey?'잠금 해제됨':'잠김'}</div></div></div>
    <p class="instr">PDF는 비밀번호로 암호화되어 이 페이지에 들어 있습니다. 비밀번호를 넣으면 브라우저 안에서 복호화해 바로 내려받을 수 있습니다. 슬라이드 내용과 페이지 번호는 원본과 같고, 용량 제한 때문에 사진 해상도만 낮췄습니다.</p>
    ${unlockedKey?'':`<form class="lock" id="lockf"><label for="pw" style="font-weight:700">비밀번호</label><input id="pw" type="password" autocomplete="current-password" placeholder="비밀번호 입력"><button class="btn" type="submit">잠금 해제</button><span class="msg" id="pwmsg" aria-live="polite"></span></form>`}
    <ul class="files">${entries.map(e=>`<li><span class="code">${e.code}</span><div class="fn"><b>${esc(e.t)}</b><span>${esc(e.info.name)} · ${fmtMB(e.info.size)}</span></div>
      <button class="btn sm ${unlockedKey?'':'ghost'}" data-dl="${e.code}" ${unlockedKey?'':'disabled'}>${unlockedKey?'다운로드':'잠김'}</button></li><li hidden data-st="${e.code}" class="msg"></li>`).join('')}</ul>
    <p class="msg" id="matmsg">${esc(matMsg)}</p>
  </section>`;
  const f=$('#lockf');
  if(f) f.onsubmit=async ev=>{
    ev.preventDefault(); const pw=$('#pw').value; const m=$('#pwmsg');
    if(!pw){ m.className='msg no'; m.textContent='비밀번호를 입력하세요.'; return; }
    m.className='msg'; m.textContent='확인 중…';
    try{
      const key=await deriveKey(pw);
      const out=new TextDecoder().decode(await decryptBuf(key,b64(MANIFEST.check)));
      if(out!=='GCT583-OK') throw 0;
      unlockedKey=key; renderMaterials();
    }catch(e){ m.className='msg no'; m.textContent='비밀번호가 맞지 않습니다. 다시 입력해 주세요.'; $('#pw').select(); }
  };
  app.querySelectorAll('[data-dl]').forEach(b=>b.onclick=()=>download(b.dataset.dl,b));
}
async function download(code,btn){
  const e=LEC[code], info=MANIFEST.files[e.f]; const st=document.querySelector(`[data-st="${code}"]`);
  st.hidden=false; st.className='msg'; btn.disabled=true;
  try{
    const parts=[];
    for(let i=0;i<info.parts.length;i++){
      st.textContent=`내려받는 중… ${i+1}/${info.parts.length}`;
      const r=await fetch(info.parts[i]); if(!r.ok) throw new Error('fetch');
      parts.push(new Uint8Array(await decryptBuf(unlockedKey, await r.arrayBuffer())));
    }
    const blob=new Blob(parts,{type:'application/pdf'});
    const dl = window.claude&&claude.use ? await claude.use('downloads') : null;
    if(!dl){
      const url=URL.createObjectURL(blob); const a=document.createElement('a');
      a.href=url; a.download=info.name; document.body.appendChild(a); a.click(); a.remove();
      setTimeout(()=>URL.revokeObjectURL(url),60000);
      st.className='msg ok'; st.textContent=`저장했습니다 · ${info.name}`; btn.disabled=false; return;
    }
    st.textContent='저장 확인 창을 확인하세요.';
    await dl.save({filename:info.name, data:blob});
    st.className='msg ok'; st.textContent=`저장했습니다 · ${info.name}`;
  }catch(err){
    st.className='msg no';
    st.textContent = err&&err.code==='declined' ? '저장을 취소했습니다.' : '다운로드하지 못했습니다. 잠시 후 다시 시도해 주세요.';
  }
  btn.disabled=false;
}

/* ======================= BOOT ======================= */
lsLoad();
if(S.current){ const c=S.current; if(!c.items||!c.items.every(i=>BYID[i.id])) S.current=null; }
render();
initDb();
</script>
